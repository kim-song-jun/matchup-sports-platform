name: Android Alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - apps/v1_android/**
      - scripts/qa/android-native-insets.test.mjs
      - .github/workflows/android-alpha.yml
  push:
    branches: [dev]
    paths:
      - apps/v1_android/**
      - scripts/qa/android-native-insets.test.mjs
      - .github/workflows/android-alpha.yml

permissions:
  contents: read

concurrency:
  group: android-alpha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_firebaseProjectIdAlpha: ${{ vars.ANDROID_ALPHA_FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_firebaseAppIdAlpha: ${{ vars.ANDROID_ALPHA_FIREBASE_APP_ID }}
      ORG_GRADLE_PROJECT_firebaseApiKeyAlpha: ${{ vars.ANDROID_ALPHA_FIREBASE_API_KEY }}
      ORG_GRADLE_PROJECT_firebaseSenderIdAlpha: ${{ vars.ANDROID_ALPHA_FIREBASE_SENDER_ID }}
      ORG_GRADLE_PROJECT_kakaoNativeAppKeyAlpha: ${{ vars.ANDROID_ALPHA_KAKAO_NATIVE_APP_KEY }}
      ANDROID_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEYSTORE_PASSWORD }}
      ANDROID_ALPHA_KEY_ALIAS: ${{ secrets.ANDROID_ALPHA_KEY_ALIAS }}
      ANDROID_ALPHA_KEY_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEY_PASSWORD }}
      # Public SHA-1 of the fixed alpha signing certificate (not a secret).
      EXPECTED_ALPHA_SIGNER_SHA1: cef37c0cf09463f05644d6531d7137aff6ac3ef4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Legacy SDK tools are no longer published; sdkmanager comes from cmdline-tools.
          packages: platform-tools

      - name: Install Android API 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify Play policy source contracts
        run: node scripts/qa/check-android-play-policy.mjs

      - name: Verify native inset script lifecycle
        run: node --test scripts/qa/android-native-insets.test.mjs

      - name: Gate Alpha Firebase configuration
        id: firebase
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "${ORG_GRADLE_PROJECT_firebaseProjectIdAlpha}" ]] || missing+=(ANDROID_ALPHA_FIREBASE_PROJECT_ID)
          [[ -n "${ORG_GRADLE_PROJECT_firebaseAppIdAlpha}" ]] || missing+=(ANDROID_ALPHA_FIREBASE_APP_ID)
          [[ -n "${ORG_GRADLE_PROJECT_firebaseApiKeyAlpha}" ]] || missing+=(ANDROID_ALPHA_FIREBASE_API_KEY)
          [[ -n "${ORG_GRADLE_PROJECT_firebaseSenderIdAlpha}" ]] || missing+=(ANDROID_ALPHA_FIREBASE_SENDER_ID)
          if (( ${#missing[@]} > 0 )); then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "::notice::Firebase Alpha variables are absent; PR runs compile/tests only and do not publish an installable FCM artifact."
              echo "ready=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Verify Alpha Firebase identity
        if: steps.firebase.outputs.ready == 'true'
        run: gradle -p apps/v1_android --no-daemon verifyAlphaFirebaseConfiguration

      - name: Materialize fixed alpha signing key
        shell: bash
        env:
          ANDROID_ALPHA_KEYSTORE_BASE64: ${{ secrets.ANDROID_ALPHA_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "${ANDROID_ALPHA_KEYSTORE_BASE64}" ]] || missing+=(ANDROID_ALPHA_KEYSTORE_BASE64)
          [[ -n "${ANDROID_ALPHA_KEYSTORE_PASSWORD}" ]] || missing+=(ANDROID_ALPHA_KEYSTORE_PASSWORD)
          [[ -n "${ANDROID_ALPHA_KEY_ALIAS}" ]] || missing+=(ANDROID_ALPHA_KEY_ALIAS)
          [[ -n "${ANDROID_ALPHA_KEY_PASSWORD}" ]] || missing+=(ANDROID_ALPHA_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing alpha signing secrets (Kakao native login needs a fixed key hash): ${missing[*]}"
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/teameet-alpha.p12"
          printf '%s' "${ANDROID_ALPHA_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_ALPHA_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test and build alpha APK and release bundle contract
        run: gradle -p apps/v1_android --no-daemon testAlphaDebugUnitTest testProductionDebugUnitTest assembleAlphaDebug bundleAlphaRelease

      - name: Verify alpha APK signer
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs apps/v1_android/app/build/outputs/apk/alpha/debug/app-alpha-debug.apk)"
          sha1="$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' <<<"${out}" | head -1)"
          kakao_hash="$(printf '%s' "${sha1}" | xxd -r -p | base64)"
          echo "Signer SHA-1: ${sha1}"
          echo "Kakao key hash: ${kakao_hash}"
          if [[ "${sha1}" != "${EXPECTED_ALPHA_SIGNER_SHA1}" ]]; then
            echo "::error::Alpha APK is not signed by the fixed alpha key"
            exit 1
          fi

      - name: Verify alpha AAB 16 KB page alignment
        shell: bash
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 apps/v1_android/app/build/outputs/bundle/alphaRelease/app-alpha-release.aab

      - name: Verify production release gates fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          GITHUB_REF_NAME=main bash scripts/release/require-android-production-ref.sh
          if GITHUB_REF_NAME=dev bash scripts/release/require-android-production-ref.sh; then
            echo "::error::Production ref guard accepted dev"
            exit 1
          fi
          if gradle -p apps/v1_android --no-daemon verifyProductionReleaseReadiness > release-gate.log 2>&1; then
            echo "::error::Production release gate accepted missing signing inputs"
            exit 1
          fi
          grep -q "Missing production release signing configuration" release-gate.log

      - name: Create alpha APK checksum
        if: steps.firebase.outputs.ready == 'true'
        working-directory: apps/v1_android/app/build/outputs/apk/alpha/debug
        run: sha256sum app-alpha-debug.apk > app-alpha-debug.apk.sha256

      - name: Upload alpha APK
        if: steps.firebase.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teameet-alpha-${{ github.sha }}
          path: |
            apps/v1_android/app/build/outputs/apk/alpha/debug/app-alpha-debug.apk
            apps/v1_android/app/build/outputs/apk/alpha/debug/app-alpha-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove alpha keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/teameet-alpha.p12"
