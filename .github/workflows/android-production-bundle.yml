name: Android Production Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-main-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require the canonical production branch
        run: bash scripts/release/require-android-production-ref.sh

  build-production-aab:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ORG_GRADLE_PROJECT_firebaseProjectIdProduction: ${{ vars.ANDROID_PRODUCTION_FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_firebaseAppIdProduction: ${{ vars.ANDROID_PRODUCTION_FIREBASE_APP_ID }}
      ORG_GRADLE_PROJECT_firebaseApiKeyProduction: ${{ vars.ANDROID_PRODUCTION_FIREBASE_API_KEY }}
      ORG_GRADLE_PROJECT_firebaseSenderIdProduction: ${{ vars.ANDROID_PRODUCTION_FIREBASE_SENDER_ID }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify Play policy source contracts
        run: node scripts/qa/check-android-play-policy.mjs

      - name: Gate production release inputs
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "${ORG_GRADLE_PROJECT_firebaseProjectIdProduction}" ]] || missing+=(ANDROID_PRODUCTION_FIREBASE_PROJECT_ID)
          [[ -n "${ORG_GRADLE_PROJECT_firebaseAppIdProduction}" ]] || missing+=(ANDROID_PRODUCTION_FIREBASE_APP_ID)
          [[ -n "${ORG_GRADLE_PROJECT_firebaseApiKeyProduction}" ]] || missing+=(ANDROID_PRODUCTION_FIREBASE_API_KEY)
          [[ -n "${ORG_GRADLE_PROJECT_firebaseSenderIdProduction}" ]] || missing+=(ANDROID_PRODUCTION_FIREBASE_SENDER_ID)
          [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [[ -n "${ANDROID_RELEASE_KEYSTORE_PASSWORD}" ]] || missing+=(ANDROID_RELEASE_KEYSTORE_PASSWORD)
          [[ -n "${ANDROID_RELEASE_KEY_ALIAS}" ]] || missing+=(ANDROID_RELEASE_KEY_ALIAS)
          [[ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ]] || missing+=(ANDROID_RELEASE_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production release inputs: ${missing[*]}"
            exit 1
          fi

      - name: Materialize release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          keystore_path="${RUNNER_TEMP}/teameet-release.jks"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test and build signed production AAB
        run: gradle -p apps/v1_android --no-daemon testProductionReleaseUnitTest bundleProductionRelease

      - name: Verify production AAB 16 KB page alignment
        shell: bash
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 apps/v1_android/app/build/outputs/bundle/productionRelease/app-production-release.aab

      - name: Create production AAB checksum
        working-directory: apps/v1_android/app/build/outputs/bundle/productionRelease
        run: sha256sum app-production-release.aab > app-production-release.aab.sha256

      - name: Upload signed production AAB
        uses: actions/upload-artifact@v4
        with:
          name: teameet-production-aab-${{ github.sha }}
          path: |
            apps/v1_android/app/build/outputs/bundle/productionRelease/app-production-release.aab
            apps/v1_android/app/build/outputs/bundle/productionRelease/app-production-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/teameet-release.jks"
