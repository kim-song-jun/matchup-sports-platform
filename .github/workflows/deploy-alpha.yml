name: Deploy Alpha

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-alpha
  cancel-in-progress: false

env:
  API_REPOSITORY: teameet-alpha-v1-api
  WEB_REPOSITORY: teameet-alpha-v1-web

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Wait for matching CI success
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 210); do
            ci_result="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/deploy.yml/runs?branch=dev&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\")][0] | if . == null then empty else [.status, (.conclusion // \"pending\")] | @tsv end")"
            if [[ -n "${ci_result}" ]]; then
              read -r ci_status ci_conclusion <<< "${ci_result}"
              if [[ "${ci_status}" == completed ]]; then
                [[ "${ci_conclusion}" == success ]] && exit 0
                echo "Matching CI finished with ${ci_conclusion}" >&2
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Matching CI did not finish within 35 minutes" >&2
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Resolve Changesets alpha version
        id: version
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          release_date="$(git show -s --format=%cs "${RELEASE_SHA}")"
          metadata="$(node scripts/release/resolve-changeset-version.mjs \
            --repo . --sha "${RELEASE_SHA}" --date "${release_date}")"
          echo "prerelease=$(jq -er '.prereleaseVersion' <<< "${metadata}")" >> "${GITHUB_OUTPUT}"
          echo "stable=$(jq -er '.stableVersion' <<< "${metadata}")" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.ALPHA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.ALPHA_AWS_REGION }}

      - name: Verify alpha AWS target
        id: target
        env:
          ALPHA_AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          ALPHA_EXPECTED_ACCOUNT_ID: ${{ vars.ALPHA_EXPECTED_ACCOUNT_ID }}
          ALPHA_DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          ALPHA_EC2_INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
        run: bash scripts/release/verify-alpha-aws-target.sh

      - name: Sign in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Package and bind versioned source
        id: source
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
        run: bash scripts/release/prepare-alpha-source.sh

      - name: Resolve rollback compatibility base
        id: rollback-base
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
        run: bash scripts/release/resolve-alpha-rollback-base.sh

      - name: Resolve immutable image tags
        id: images
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          imageTag="sha-${RELEASE_SHA}"
          api_exists=false
          web_exists=false
          aws ecr describe-images --repository-name "${API_REPOSITORY}" \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && api_exists=true
          aws ecr describe-images --repository-name "${WEB_REPOSITORY}" \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && web_exists=true
          echo "imageTag=${imageTag}" >> "${GITHUB_OUTPUT}"
          echo "api_exists=${api_exists}" >> "${GITHUB_OUTPUT}"
          echo "web_exists=${web_exists}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push immutable API image
        if: steps.images.outputs.api_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-api
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ steps.images.outputs.imageTag }}
          cache-from: type=gha,scope=alpha-v1-api
          cache-to: type=gha,mode=max,scope=alpha-v1-api
          provenance: false
          sbom: false

      - name: Build and push immutable Web image
        if: steps.images.outputs.web_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-web
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:${{ steps.images.outputs.imageTag }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_ORIGIN=http://v1_api:8121
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            # alpha 는 자기 콜백을 써야 한다 — prod 값(teameet.co.kr)이 박히면 alpha 에서
            # 카카오 로그인을 끝까지 진행할 수 없다. ALPHA_KAKAO_REDIRECT_URI 는 c135ebe6
            # 에서 바로 이 목적으로 만들어졌는데, 이후 배포 방식을 매니페스트/SSM 으로
            # 바꾸면서 배선만 끊겼다(시크릿 자체는 계속 살아 있다).
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.ALPHA_KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_ALPHA }}
          cache-from: type=gha,scope=alpha-v1-web
          cache-to: type=gha,mode=max,scope=alpha-v1-web
          provenance: false
          sbom: false

      - name: Gate ECR critical findings
        env:
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
        run: bash scripts/release/check-alpha-image-scans.sh

      - name: Create or reuse immutable release manifest
        id: manifest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          SOURCE_VERSION_ID: ${{ steps.source.outputs.sourceVersionId }}
          SOURCE_SHA256: ${{ steps.source.outputs.sourceSha256 }}
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
          PREVIOUS_SHA: ${{ steps.rollback-base.outputs.previousSha }}
          MIGRATION_BASE_SHA: ${{ steps.rollback-base.outputs.migrationBaseSha }}
        run: bash scripts/release/create-alpha-release-manifest.sh

      - name: Sync inquiry Slack runtime env
        env:
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          SECRET_SLACK_INQUIRY_WEBHOOK_URL: ${{ secrets.SLACK_INQUIRY_WEBHOOK_URL }}
        run: bash scripts/release/sync-alpha-inquiry-slack-env.sh

      # Skipped until the four APNs secrets are registered, rather than failing the deploy.
      # A push-less alpha is a working alpha; a blocked deploy is not. The step reports which
      # names are missing so the gap is visible in the run rather than only in a silent
      # "iOS push disabled" line in the API's startup log.
      - name: Sync APNs runtime env
        env:
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          SECRET_APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          SECRET_APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          SECRET_APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          SECRET_APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          missing=()
          for name in SECRET_APNS_KEY_ID SECRET_APNS_TEAM_ID SECRET_APNS_BUNDLE_ID SECRET_APNS_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("${name#SECRET_}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::iOS push stays disabled on alpha — missing secrets: ${missing[*]}"
            exit 0
          fi
          # Never fails the deploy. Push configuration is a side task here, and the first
          # version of this step proved the point by blocking an alpha release over the
          # shape of one secret. A warning is loud enough: the run summary carries it, and
          # the symptom on the server side is push staying disabled, not a broken alpha.
          bash scripts/release/sync-alpha-apns-env.sh \
            || echo "::warning::APNs env sync did not complete; iOS push stays disabled on alpha"

      - name: Deploy through AWS Systems Manager
        timeout-minutes: 25
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          SOURCE_VERSION_ID: ${{ steps.source.outputs.sourceVersionId }}
          SOURCE_SHA256: ${{ steps.source.outputs.sourceSha256 }}
          MANIFEST_VERSION_ID: ${{ steps.manifest.outputs.manifestVersionId }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifestSha256 }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
        run: bash scripts/release/deploy-alpha-via-ssm.sh

      - name: Verify public alpha release identity
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 36); do
            headers="$(curl -fsSI https://alpha.teameet.co.kr/landing 2>/dev/null || true)"
            version="$(awk -F': ' 'tolower($1) == "x-teameet-release" { gsub("\r", "", $2); print $2 }' <<< "${headers}")"
            sha="$(awk -F': ' 'tolower($1) == "x-teameet-commit" { gsub("\r", "", $2); print $2 }' <<< "${headers}")"
            db="$(curl -fsS https://alpha.teameet.co.kr/api/v1/health 2>/dev/null | jq -r '.data.checks.db // false' 2>/dev/null || true)"
            [[ "${version}" == "${RELEASE_VERSION}" && "${sha}" == "${RELEASE_SHA}" && "${db}" == true ]] && exit 0
            sleep 5
          done
          echo "Alpha did not expose the expected immutable release identity" >&2
          exit 1
