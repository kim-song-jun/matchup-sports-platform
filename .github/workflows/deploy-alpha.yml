name: Deploy Alpha

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      task168_recovery_from_json:
        description: "Immutable Task168 failed-preflight recovery evidence JSON"
        required: false
        type: string
        default: ""
      # StageB entry points (m11-stageb-spec.md §2, .task168-stageb-a2-contract.md §2).
      # stageBResume is intentionally absent — its dispatch input is withheld pending
      # user decision U2; only its receipt/lock/label contract is pre-wired elsewhere.
      task168_stage:
        description: >-
          Task 168 stage. stageAIntermediate (default) is the push-equivalent path;
          the StageB values are dispatch-only and gated below.
        required: false
        type: choice
        options:
          - stageAIntermediate
          - stageBPreflight
          - stageBFinal
          - stageBRecover
        default: stageAIntermediate
      # Optional: the StageA release this StageB dispatch cuts over from. Empty
      # means "the same commit as this dispatch", the expected case (StageB is
      # dispatched against the SHA that a prior push already deployed as StageA).
      task168_predecessor_release_sha:
        description: "StageA predecessor release SHA for stageBPreflight/stageBFinal (default: this commit)"
        required: false
        type: string
        default: ""
      # U11: no default is assumed. StageB dispatch is refused without this.
      task168_stage_b_timeout_seconds:
        description: >-
          Required for stageBPreflight/stageBFinal/stageBRecover only: the SSM
          RunShellScript executionTimeout in seconds (U11 — set from T5 rehearsal's
          measured worst-case duration, no assumed default).
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-alpha
  cancel-in-progress: false

env:
  API_REPOSITORY: teameet-alpha-v1-api
  WEB_REPOSITORY: teameet-alpha-v1-web

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      # Resolves the stage for every step below. A push event never carries
      # workflow_dispatch inputs, so GITHUB_EVENT_NAME pins push to
      # stageAIntermediate regardless of what a stale UI default might show —
      # this is the "push never reaches StageB" guarantee (T1 completion #1).
      - name: Resolve Task 168 stage
        id: task168
        env:
          STAGE_INPUT: ${{ inputs.task168_stage }}
          TIMEOUT_INPUT: ${{ inputs.task168_stage_b_timeout_seconds }}
        run: |
          set -Eeuo pipefail
          stage="${STAGE_INPUT:-stageAIntermediate}"
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]]; then
            stage="stageAIntermediate"
          fi
          case "${stage}" in
            stageAIntermediate|stageBPreflight|stageBFinal|stageBRecover) ;;
            *)
              echo "Unknown task168_stage: '${stage}'" >&2
              exit 1
              ;;
          esac
          step_timeout_minutes=25
          if [[ "${stage}" != stageAIntermediate ]]; then
            if [[ -z "${TIMEOUT_INPUT:-}" || ! "${TIMEOUT_INPUT}" =~ ^[0-9]+$ ]]; then
              echo "task168_stage_b_timeout_seconds is required for ${stage} (U11 has no assumed default)" >&2
              exit 1
            fi
            # executionTimeout + 10 minutes (PR-A2 SSM timeout item): the polling
            # loop and this step's own timeout must both outlive the SSM document's
            # own executionTimeout, or a slow-but-successful host run reports as a
            # step timeout instead of the UNKNOWN_HOST_MAY_BE_RUNNING classification
            # deploy-alpha-via-ssm.sh is responsible for.
            step_timeout_minutes=$(( (TIMEOUT_INPUT + 59) / 60 + 10 ))
          fi
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "timeoutSeconds=${TIMEOUT_INPUT:-}" >> "${GITHUB_OUTPUT}"
          echo "stepTimeoutMinutes=${step_timeout_minutes}" >> "${GITHUB_OUTPUT}"

      - name: Wait for matching CI success
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 210); do
            ci_result="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/deploy.yml/runs?branch=dev&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\")][0] | if . == null then empty else [.status, (.conclusion // \"pending\")] | @tsv end")"
            if [[ -n "${ci_result}" ]]; then
              read -r ci_status ci_conclusion <<< "${ci_result}"
              if [[ "${ci_status}" == completed ]]; then
                [[ "${ci_conclusion}" == success ]] && exit 0
                echo "Matching CI finished with ${ci_conclusion}" >&2
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Matching CI did not finish within 35 minutes" >&2
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Resolve Changesets alpha version
        id: version
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          release_date="$(git show -s --format=%cs "${RELEASE_SHA}")"
          metadata="$(node scripts/release/resolve-changeset-version.mjs \
            --repo . --sha "${RELEASE_SHA}" --date "${release_date}")"
          echo "prerelease=$(jq -er '.prereleaseVersion' <<< "${metadata}")" >> "${GITHUB_OUTPUT}"
          echo "stable=$(jq -er '.stableVersion' <<< "${metadata}")" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.ALPHA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.ALPHA_AWS_REGION }}

      - name: Verify alpha AWS target
        id: target
        env:
          ALPHA_AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          ALPHA_EXPECTED_ACCOUNT_ID: ${{ vars.ALPHA_EXPECTED_ACCOUNT_ID }}
          ALPHA_DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          ALPHA_EC2_INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
        run: bash scripts/release/verify-alpha-aws-target.sh

      - name: Sign in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Package and bind versioned source
        id: source
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
        run: bash scripts/release/prepare-alpha-source.sh

      - name: Resolve rollback compatibility base
        id: rollback-base
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
        run: bash scripts/release/resolve-alpha-rollback-base.sh

      - name: Resolve immutable image tags
        id: images
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          imageTag="sha-${RELEASE_SHA}"
          toolTag="task168-${RELEASE_SHA}"
          api_exists=false
          web_exists=false
          tool_exists=false
          aws ecr describe-images --repository-name "${API_REPOSITORY}" \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && api_exists=true
          aws ecr describe-images --repository-name "${WEB_REPOSITORY}" \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && web_exists=true
          aws ecr describe-images --repository-name "${API_REPOSITORY}" \
            --image-ids "imageTag=${toolTag}" >/dev/null 2>&1 && tool_exists=true
          echo "imageTag=${imageTag}" >> "${GITHUB_OUTPUT}"
          echo "toolTag=${toolTag}" >> "${GITHUB_OUTPUT}"
          echo "api_exists=${api_exists}" >> "${GITHUB_OUTPUT}"
          echo "web_exists=${web_exists}" >> "${GITHUB_OUTPUT}"
          echo "tool_exists=${tool_exists}" >> "${GITHUB_OUTPUT}"

      - name: Bind one-shot Task 168 manifest inputs
        env:
          TASK168_RECOVERY_FROM_JSON: ${{ inputs.task168_recovery_from_json }}
        run: bash scripts/release/prepare-task168-stage-manifest-inputs.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push immutable API image
        if: steps.images.outputs.api_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-api
          # Explicit target — Dockerfile.v1-api now has a StageB stage (runtime-task168-final)
          # in front of this one. Without this, adding that stage would silently retarget
          # every untargeted build (this one and prod's) to the newest stage in the file.
          target: runtime
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ steps.images.outputs.imageTag }}
          cache-from: type=gha,scope=alpha-v1-api
          cache-to: type=gha,mode=max,scope=alpha-v1-api
          provenance: false
          sbom: false

      - name: Build and push immutable Task 168 cutover tool
        if: steps.images.outputs.tool_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-api
          target: task168-cutover-tool
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ steps.images.outputs.toolTag }}
          cache-from: type=gha,scope=alpha-v1-task168-cutover
          cache-to: type=gha,mode=max,scope=alpha-v1-task168-cutover
          provenance: false
          sbom: false

      - name: Build and push immutable Web image
        if: steps.images.outputs.web_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-web
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:${{ steps.images.outputs.imageTag }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_ORIGIN=http://v1_api:8121
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            # alpha 는 자기 콜백을 써야 한다 — prod 값(teameet.co.kr)이 박히면 alpha 에서
            # 카카오 로그인을 끝까지 진행할 수 없다. ALPHA_KAKAO_REDIRECT_URI 는 c135ebe6
            # 에서 바로 이 목적으로 만들어졌는데, 이후 배포 방식을 매니페스트/SSM 으로
            # 바꾸면서 배선만 끊겼다(시크릿 자체는 계속 살아 있다).
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.ALPHA_KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_ALPHA }}
          cache-from: type=gha,scope=alpha-v1-web
          cache-to: type=gha,mode=max,scope=alpha-v1-web
          provenance: false
          sbom: false

      - name: Gate ECR critical findings
        env:
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
        run: bash scripts/release/check-alpha-image-scans.sh

      # ── Task 168 StageB (dispatch-only) ─────────────────────────────────────
      # Every step in this block is gated on stageBPreflight/stageBFinal and is a
      # no-op — not merely skipped-looking, but structurally unreachable — on the
      # push trigger and on stageAIntermediate/stageBRecover dispatches (T1
      # completion #1/#2). stageBRecover needs none of these: it only diagnoses
      # and recovers already-staged host state (m11-stageb-spec.md §6.2-8) and is
      # wired directly into the SSM step below.
      #
      # `prepare-task168-final-stage-inputs.sh` and `package-task168-final-source.sh`
      # are PR-A1 (runner track) deliverables — this block calls them by the CLI
      # contract already frozen in the candidate scripts. Until PR-A1 lands these
      # two steps fail closed on a genuine StageB dispatch; they can never run on
      # push, so main CI is unaffected either way.
      - name: Resolve Task168 StageB final image tag
        id: stageb-images
        if: steps.task168.outputs.stage == 'stageBPreflight' || steps.task168.outputs.stage == 'stageBFinal'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          # task168-final-<sha> — never sha-<sha> (D-2: that tag is already claimed
          # by the StageA image the push deploy for this same commit already built,
          # and reusing it would make "Resolve immutable image tags" above report
          # api_exists=true and skip building the StageB client entirely).
          finalImageTag="task168-final-${RELEASE_SHA}"
          final_exists=false
          aws ecr describe-images --repository-name "${API_REPOSITORY}" \
            --image-ids "imageTag=${finalImageTag}" >/dev/null 2>&1 && final_exists=true
          echo "finalImageTag=${finalImageTag}" >> "${GITHUB_OUTPUT}"
          echo "final_exists=${final_exists}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Task168 StageB final API image
        if: (steps.task168.outputs.stage == 'stageBPreflight' || steps.task168.outputs.stage == 'stageBFinal') && steps.stageb-images.outputs.final_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-api
          target: runtime-task168-final
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ steps.stageb-images.outputs.finalImageTag }}
          cache-from: type=gha,scope=alpha-v1-api-task168-final
          cache-to: type=gha,mode=max,scope=alpha-v1-api-task168-final
          provenance: false
          sbom: false

      - name: Prepare Task168 StageB final source inputs
        id: stageb-inputs
        if: steps.task168.outputs.stage == 'stageBPreflight' || steps.task168.outputs.stage == 'stageBFinal'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          preparedDir="$(mktemp -d)/task168-final-inputs"
          bash scripts/release/prepare-task168-final-stage-inputs.sh \
            --source-dir . \
            --source-commit "${RELEASE_SHA}" \
            --final-schema deploy/task168-final-drop/schema.prisma \
            --m11 deploy/task168-final-drop/migrations/20260911090000_retire_tournament_fixture_tables/migration.sql \
            --output-dir "${preparedDir}"
          echo "preparedDir=${preparedDir}" >> "${GITHUB_OUTPUT}"

      # Namespaced key (D-2): releases/task168-stage-b/<sha>.tar.gz — never the
      # StageA key (releases/<sha>.tar.gz), which the push deploy for this same
      # commit has already claimed. Reuses an existing upload by content hash so
      # re-dispatching the same SHA (e.g. stageBPreflight then stageBFinal) does
      # not re-upload.
      - name: Package and upload Task168 StageB source
        id: stageb-source
        if: steps.task168.outputs.stage == 'stageBPreflight' || steps.task168.outputs.stage == 'stageBFinal'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PREPARED_DIR: ${{ steps.stageb-inputs.outputs.preparedDir }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          archive="${work}/task168-stage-b-${RELEASE_SHA}.tar.gz"
          attestation="${archive}.attestation.json"
          bash scripts/release/package-task168-final-source.sh \
            --source-dir . \
            --source-commit "${RELEASE_SHA}" \
            --prepared-dir "${PREPARED_DIR}" \
            --final-schema deploy/task168-final-drop/schema.prisma \
            --m11 deploy/task168-final-drop/migrations/20260911090000_retire_tournament_fixture_tables/migration.sql \
            --output-archive "${archive}" \
            --output-attestation "${attestation}"
          archiveSha256="$(sha256sum "${archive}" | awk '{print $1}')"
          key="releases/task168-stage-b/${RELEASE_SHA}.tar.gz"
          if versionId="$(aws s3api head-object --bucket "${DEPLOY_BUCKET}" --key "${key}" \
            --expected-bucket-owner "${EXPECTED_BUCKET_OWNER}" --query VersionId --output text 2>/dev/null)"; then
            stored="$(aws s3api get-object --bucket "${DEPLOY_BUCKET}" --key "${key}" --version-id "${versionId}" \
              --expected-bucket-owner "${EXPECTED_BUCKET_OWNER}" "${work}/stored.tar.gz" >/dev/null && \
              sha256sum "${work}/stored.tar.gz" | awk '{print $1}')"
            [[ "${stored}" == "${archiveSha256}" ]] ||
              { echo "Stored StageB source ${key} has a different content hash" >&2; exit 1; }
          else
            versionId="$(aws s3api put-object --bucket "${DEPLOY_BUCKET}" --key "${key}" --body "${archive}" \
              --if-none-match '*' --expected-bucket-owner "${EXPECTED_BUCKET_OWNER}" --query VersionId --output text)"
          fi
          echo "sourceVersionId=${versionId}" >> "${GITHUB_OUTPUT}"
          echo "sourceSha256=${archiveSha256}" >> "${GITHUB_OUTPUT}"
          echo "attestationPath=${attestation}" >> "${GITHUB_OUTPUT}"
          echo "attestationSha256=$(sha256sum "${attestation}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      # The StageA predecessor's transition receipt and the live DB identity are
      # generated/known only on the Alpha host — GH Actions has no other path to
      # them. This mirrors deploy.yml's "Resolve internal API origin" (an SSM
      # RunShellScript read, no runtime mutation) rather than inventing a new
      # transport. Least-verified step in this file: it has never been exercised
      # against real Alpha infra (this session does not touch AWS/SSM/Alpha).
      - name: Resolve Task168 StageA predecessor transition
        id: stageb-predecessor
        if: steps.task168.outputs.stage == 'stageBPreflight' || steps.task168.outputs.stage == 'stageBFinal'
        env:
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          PREDECESSOR_SHA: ${{ inputs.task168_predecessor_release_sha != '' && inputs.task168_predecessor_release_sha || steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "${PREDECESSOR_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "task168_predecessor_release_sha must be a full commit SHA" >&2; exit 1; }
          # Ship this checkout's own script bytes as the SSM command payload,
          # base64-encoded so no quoting/escaping of its content is needed —
          # the live host tree is whatever a PRIOR StageA push deployed, which
          # may predate this script's existence, so a path reference on the
          # host is not reliable here.
          script_b64="$(base64 < scripts/release/read-task168-stage-a-predecessor.sh | tr -d '\n')"
          remote_command="echo ${script_b64} | base64 -d | bash -s -- ${PREDECESSOR_SHA}"
          cmd_id="$(aws ssm send-command --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Teameet Task168 StageB predecessor read ${PREDECESSOR_SHA}" \
            --parameters "commands=[$(jq -Rsc . <<< "${remote_command}")]" \
            --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "${cmd_id}" \
              --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
            [[ "${status}" == "InProgress" || "${status}" == "Pending" || -z "${status}" ]] || break
            sleep 3
          done
          [[ "${status:-}" == "Success" ]] ||
            { echo "Could not read the StageA predecessor transition (status=${status:-unknown})" >&2; exit 1; }
          result="$(aws ssm get-command-invocation --command-id "${cmd_id}" \
            --instance-id "${INSTANCE_ID}" --query StandardOutputContent --output text)"
          jq -e 'has("path") and has("sha256") and has("apiImage") and has("databaseIdentity") and has("resolvedMigrationAttemptsSha256")' <<< "${result}" >/dev/null ||
            { echo "Predecessor read did not return the expected fields" >&2; exit 1; }
          echo "releaseSha=${PREDECESSOR_SHA}" >> "${GITHUB_OUTPUT}"
          echo "transitionPath=$(jq -r .path <<< "${result}")" >> "${GITHUB_OUTPUT}"
          echo "transitionSha256=$(jq -r .sha256 <<< "${result}")" >> "${GITHUB_OUTPUT}"
          echo "apiImage=$(jq -r .apiImage <<< "${result}")" >> "${GITHUB_OUTPUT}"
          echo "databaseIdentity=$(jq -r .databaseIdentity <<< "${result}")" >> "${GITHUB_OUTPUT}"
          echo "resolvedMigrationAttemptsSha256=$(jq -r .resolvedMigrationAttemptsSha256 <<< "${result}")" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse Task168 StageB release manifest
        id: stageb-manifest
        if: steps.task168.outputs.stage == 'stageBPreflight' || steps.task168.outputs.stage == 'stageBFinal'
        env:
          TASK168_STAGE: stageBFinal
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          SOURCE_VERSION_ID: ${{ steps.stageb-source.outputs.sourceVersionId }}
          SOURCE_SHA256: ${{ steps.stageb-source.outputs.sourceSha256 }}
          IMAGE_TAG: ${{ steps.stageb-images.outputs.finalImageTag }}
          # Web is unchanged by the Prisma schema — reuse StageA's build rather
          # than rebuild it. cutoverTool likewise reuses StageA's already-built
          # image: the runner validates the manifest's cutoverTool field for
          # shape only and never actually invokes it in StageB (m11-stageb-spec.md
          # candidate deploy/task168-stage-b-migrate.sh extracts TOOL_IMAGE but
          # never runs it), so there is nothing StageB-specific to build here.
          WEB_IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
          TOOL_IMAGE_TAG: ${{ steps.images.outputs.toolTag }}
          TASK168_PREDECESSOR_RELEASE_SHA: ${{ steps.stageb-predecessor.outputs.releaseSha }}
          TASK168_PREDECESSOR_TRANSITION_PATH: ${{ steps.stageb-predecessor.outputs.transitionPath }}
          TASK168_PREDECESSOR_TRANSITION_SHA256: ${{ steps.stageb-predecessor.outputs.transitionSha256 }}
          TASK168_PREDECESSOR_API_IMAGE: ${{ steps.stageb-predecessor.outputs.apiImage }}
          TASK168_PREDECESSOR_DATABASE_IDENTITY: ${{ steps.stageb-predecessor.outputs.databaseIdentity }}
          TASK168_RESOLVED_MIGRATION_ATTEMPTS_SHA256: ${{ steps.stageb-predecessor.outputs.resolvedMigrationAttemptsSha256 }}
          TASK168_FINAL_PREFLIGHT_RECEIPT_PATH: ${{ steps.stageb-source.outputs.attestationPath }}
          TASK168_FINAL_PREFLIGHT_RECEIPT_SHA256: ${{ steps.stageb-source.outputs.attestationSha256 }}
          TASK168_FINAL_PREFLIGHT_INPUT_SNAPSHOT_SHA256: ${{ steps.stageb-source.outputs.attestationSha256 }}
        run: bash scripts/release/create-alpha-release-manifest.sh

      - name: Create or reuse immutable release manifest
        id: manifest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          SOURCE_VERSION_ID: ${{ steps.source.outputs.sourceVersionId }}
          SOURCE_SHA256: ${{ steps.source.outputs.sourceSha256 }}
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
          TOOL_IMAGE_TAG: ${{ steps.images.outputs.toolTag }}
          PREVIOUS_SHA: ${{ steps.rollback-base.outputs.previousSha }}
          MIGRATION_BASE_SHA: ${{ steps.rollback-base.outputs.migrationBaseSha }}
        run: bash scripts/release/create-alpha-release-manifest.sh

      - name: Sync inquiry Slack runtime env
        env:
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          SECRET_SLACK_INQUIRY_WEBHOOK_URL: ${{ secrets.SLACK_INQUIRY_WEBHOOK_URL }}
        run: bash scripts/release/sync-alpha-inquiry-slack-env.sh

      - name: Sync FCM service-account runtime env
        env:
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
        run: bash scripts/release/sync-alpha-firebase-env.sh

      # Skipped until the four APNs secrets are registered, rather than failing the deploy.
      # A push-less alpha is a working alpha; a blocked deploy is not. The step reports which
      # names are missing so the gap is visible in the run rather than only in a silent
      # "iOS push disabled" line in the API's startup log.
      - name: Sync APNs runtime env
        env:
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          SECRET_APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          SECRET_APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          SECRET_APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          SECRET_APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          missing=()
          for name in SECRET_APNS_KEY_ID SECRET_APNS_TEAM_ID SECRET_APNS_BUNDLE_ID SECRET_APNS_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("${name#SECRET_}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::APNs secrets are not set, so the host's APNs env was not updated — missing: ${missing[*]}"
            exit 0
          fi
          # Never fails the deploy. Push configuration is a side task here, and the first
          # version of this step proved the point by blocking an alpha release over the
          # shape of one secret. A warning is loud enough: the run summary carries it, and
          # the symptom on the server side is push staying disabled, not a broken alpha.
          bash scripts/release/sync-alpha-apns-env.sh \
            || echo "::warning::APNs env sync did not complete; the host's APNs env may be unchanged from before"

      - name: Deploy through AWS Systems Manager
        timeout-minutes: ${{ fromJSON(steps.task168.outputs.stepTimeoutMinutes) }}
        env:
          TASK168_STAGE: ${{ steps.task168.outputs.stage }}
          TASK168_STAGE_B_TIMEOUT_SECONDS: ${{ steps.task168.outputs.timeoutSeconds }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
          DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ steps.target.outputs.account_id }}
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          # StageA params — byte-identical to before Task168 StageB existed.
          SOURCE_VERSION_ID: ${{ steps.source.outputs.sourceVersionId }}
          SOURCE_SHA256: ${{ steps.source.outputs.sourceSha256 }}
          MANIFEST_VERSION_ID: ${{ steps.manifest.outputs.manifestVersionId }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifestSha256 }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          # StageB params — unused (empty) on the stageAIntermediate path.
          STAGE_B_SOURCE_VERSION_ID: ${{ steps.stageb-source.outputs.sourceVersionId }}
          STAGE_B_SOURCE_SHA256: ${{ steps.stageb-source.outputs.sourceSha256 }}
          STAGE_B_MANIFEST_VERSION_ID: ${{ steps.stageb-manifest.outputs.manifestVersionId }}
          STAGE_B_MANIFEST_SHA256: ${{ steps.stageb-manifest.outputs.manifestSha256 }}
        run: bash scripts/release/deploy-alpha-via-ssm.sh

      - name: Verify public alpha release identity
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.prerelease }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 36); do
            headers="$(curl -fsSI https://alpha.teameet.co.kr/landing 2>/dev/null || true)"
            version="$(awk -F': ' 'tolower($1) == "x-teameet-release" { gsub("\r", "", $2); print $2 }' <<< "${headers}")"
            sha="$(awk -F': ' 'tolower($1) == "x-teameet-commit" { gsub("\r", "", $2); print $2 }' <<< "${headers}")"
            db="$(curl -fsS https://alpha.teameet.co.kr/api/v1/health 2>/dev/null | jq -r '.data.checks.db // false' 2>/dev/null || true)"
            [[ "${version}" == "${RELEASE_VERSION}" && "${sha}" == "${RELEASE_SHA}" && "${db}" == true ]] && exit 0
            sleep 5
          done
          echo "Alpha did not expose the expected immutable release identity" >&2
          exit 1
