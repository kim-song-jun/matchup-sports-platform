name: CI / Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# PR 간 상호 취소 방지: 그룹을 PR/ref 단위로 분리
# - pull_request: 같은 PR의 이전 attempt만 취소 (ci-pr-N)
# - main push · workflow_dispatch: 취소 없이 직렬 큐
# 프로덕션 배포 직렬화는 build-images/deploy job의 job-level concurrency가 담당
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gates: 릴리스 계약 검사 ─────────────────────────────────────────────────
  # DB도 앱 빌드도 필요 없는 초 단위 검사라 api/web 과 병렬로 돌린다.
  gates:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release changeset
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git merge-base origin/main "${HEAD_SHA}")"
          fi
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > /tmp/teameet-changed-files.txt
          if [[ ${BASE_REF} == main && ${HEAD_REF} == dev ]]; then
            # A Changeset can be added and consumed entirely between main and dev,
            # so it is absent from the final tree diff. Preserve deleted Changeset
            # paths from commit history as the auditable release receipt.
            git log --format= --name-only --diff-filter=D \
              "${BASE_SHA}..${HEAD_SHA}" -- '.changeset/*.md' \
              >> /tmp/teameet-changed-files.txt
            sort -u -o /tmp/teameet-changed-files.txt /tmp/teameet-changed-files.txt
            export RELEASE_PROMOTION=true
            export BASE_API_VERSION=$(git show ${BASE_SHA}:apps/v1_api/package.json | jq -er .version)
            export BASE_WEB_VERSION=$(git show ${BASE_SHA}:apps/v1_web/package.json | jq -er .version)
          fi
          node scripts/release/check-changeset-policy.mjs \
            --repo . \
            --changed-files-file /tmp/teameet-changed-files.txt

      - name: Validate planned SemVer
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        env:
          RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            release_date="$(git show -s --format=%cs "${RELEASE_SHA}")"
            node scripts/release/resolve-changeset-version.mjs \
              --repo . \
              --sha "${RELEASE_SHA}" \
              --date "${release_date}" |
              jq -e '.stableVersion and .prereleaseVersion'
          else
            echo "No unreleased Changesets; planned release validation skipped"
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: V1 DB guardrails
        run: pnpm qa:v1-db-guardrails

      - name: Production deploy security guardrails
        run: pnpm qa:production-deploy-security

      # 이 가드 자체가 약해서 놓친 전례가 있다 — `ssh -o ... ec2` 를 미탐하고 인라인 주석에는
      # 오탐했다(2026-08-02). 탐지 로직을 바꿀 때 그 회귀를 잡도록 동작을 테스트로 고정한다.
      - name: Prod deploy security guard tests
        run: node --test scripts/qa/prod-deploy-security-guard.test.mjs

      # 이 스위트는 존재만 하고 CI 에서 한 번도 실행되지 않았다 — 그래서
      # "changeset 을 전부 소비하면 alpha 배포가 깨진다"는 계약 위반이 계속 살아 있었다.
      # 디렉터리 인자(`node --test scripts/release/`)는 Node 버전에 따라 모듈 해석으로
      # 넘어가므로 파일을 명시한다.
      - name: Release contract tests
        run: node --test scripts/release/versioning.contract.test.mjs

      - name: Alpha release-state contract tests
        run: bash scripts/qa/test-alpha-release-state.sh

      # alpha 는 로컬 이미지 GC 가 없어 dangling 이미지가 배포마다 쌓였고, 실제로 EC2
      # 디스크가 28G/30G 까지 차서 배포와 롤백이 함께 "no space left on device" 로 실패했다
      # (2026-08). 이 테스트는 그 재발 방지 로직(prune_stale_alpha_images)이 정확히 어떤
      # 이미지를 지우고 어떤 이미지를 살리는지, 그리고 deploy-alpha.sh 안에서 healthy 확인
      # 뒤에만 호출되는지를 매 push 마다 고정한다.
      - name: Alpha image GC contract tests
        run: bash scripts/qa/test-alpha-image-gc.sh

      # 이미지 스캔 게이트는 배포 job 안에서만 도는 탓에 두 결함이 오래 살아남았다.
      # (1) 일시적 AWS CLI 내부 오류('NoneType' object does not support item assignment)에
      #     재시도가 없어 배포가 그대로 죽었다 — 2026-08-08~09 alpha 에서만 3회.
      # (2) 더 심각하게, findings 를 못 읽으면 critical="" 이 되고 bash 산술이 빈 값을 0 으로
      #     취급해 **게이트가 조용히 통과**했다(fail-open). 실제 배포 로그에 그 흔적이 있다:
      #     `[alpha-scan] teameet-alpha-v1-api critical= high=`.
      # 두 결함 모두 alpha/prod 복사본에 똑같이 있었다. 이 테스트는 가짜 aws 로 그 시나리오를
      # 재현해 매 push 마다 고정한다 — 수정 전 스크립트로 돌리면 3건이 실패한다.
      - name: Image scan gate contract tests
        run: bash scripts/qa/test-image-scan-gate.sh

      # prod 배포 경로는 main push 때만 도는 탓에 몇 주씩 검증되지 않는다 — 그래서
      # prune_stale_release_tags 의 빈 입력 버그가 2026-08-01 배포에서야 터졌다(#220).
      # 이번 변경으로 EC2 가 더 이상 로컬 docker build 를 하지 않고 ECR digest 를 pull 만
      # 하므로(요구사항 1·2) 그 함수가 지키던 문제 자체가 사라져 함수와 이 테스트를 제거
      # 했다 — 대신 alpha 와 동일한 candidate→promote 상태 기계장치 계약 테스트로 교체한다.
      # 이 스텝도 모든 PR·push 에서 돌아 같은 계열(main push 전용 경로가 몇 주씩 검증되지
      # 않는) 버그를 배포 전에 잡는다.
      - name: Prod release-state contract tests
        run: bash scripts/qa/test-prod-release-state.sh

      # rollback-prod.sh 는 지금까지 어떤 CI 에서도 실행된 적이 없고, 유일한 실행처가
      # 라이브 프로덕션 EC2 였다 — 즉 "처음 롤백이 필요한 순간" 이 사실상 첫 실행이다.
      # 롤백은 이미 뭔가 잘못된 상황에서만 쓰는 경로라, 그때 처음 버그를 만나면 복구 수단이
      # 통째로 없는 것과 같다. 최소한 진입 가드만이라도 매 push 에서 실제 실행해 확인한다.
      # (런타임 오케스트레이션 전체는 실제 EC2 리허설이 필요하다 — 이 테스트의 범위 밖이다.)
      - name: Prod rollback guard tests
        run: bash scripts/qa/test-prod-rollback-guards.sh

      # expand-contract 게이트를 **머지 전에** 돌린다.
      #
      # 2026-08-20 사고: 이 검사가 `deploy` job 에만 있었고 그 job 은 PR 에서 skip 된다.
      # 그래서 마이그레이션을 포함한 PR 이 모든 체크를 통과해 머지됐고, 배포 단계에서야
      # 거부돼 **alpha 가 2시간 20분 막혔다**(그사이 모든 세션의 실화면 검증이 멈췄다).
      # 머지 후에야 알 수 있는 게이트는 게이트로서 늦다.
      #
      # base 는 PR 의 merge-base 다 — deploy 가 쓰는 "직전 릴리스" 기준과는 다르지만,
      # 이 자리에서 답해야 하는 질문은 "이 PR 이 non-additive 문장을 **새로 들여오는가**"
      # 이므로 그쪽이 맞다. 배포 시점의 최종 판정은 `deploy` job 이 그대로 유지한다
      # (이 스텝은 그것을 대체하지 않고 앞당길 뿐이다).
      #
      # PR 에서만 돈다: push 이벤트에는 신뢰할 만한 base 가 없고, dev push 는 곧바로
      # `deploy` 가 같은 검사를 실제 릴리스 기준으로 수행한다.
      - name: Expand-contract migration gate (PR)
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          # base 는 이벤트 payload 를 우선 쓴다. `git merge-base origin/<base>` 로 직접
          # 구하려다 실패했는데(2026-08-20), PR 체크아웃에는 base 브랜치의 원격 추적 ref
          # 가 없어 `origin/dev` 를 해석하지 못한다 — 바로 위 changeset 스텝이 payload
          # 값을 먼저 쓰고 못 쓸 때만 fetch 로 보강하는 것도 같은 이유다.
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "${BASE_REF}"
            BASE_SHA="$(git merge-base FETCH_HEAD "${HEAD_SHA}")"
          fi
          echo "expand-contract gate: ${BASE_SHA} -> ${HEAD_SHA}"
          node scripts/qa/check-expand-contract-migrations.mjs "${BASE_SHA}" "${HEAD_SHA}"

  # ── API: 타입·마이그레이션·유닛·통합·빌드 ───────────────────────────────────
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teameet_test
          POSTGRES_PASSWORD: teameet_test
          POSTGRES_DB: teameet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teameet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://teameet_test:teameet_test@localhost:5432/teameet_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate V1 Prisma client
        run: cd apps/v1_api && pnpm prisma generate

      - name: V1 API type-check
        run: pnpm --filter v1_api exec tsc --noEmit

      # 마이그레이션 게이트: 빈 DB에 전체 체인 재생 + schema.prisma 드리프트 0 검증.
      # db push로만 스키마를 바꾸면 여기서 CI가 깨진다 — 반드시 migration 파일 동반.
      # (2026-07-12 프로덕션 장애 재발 방지: 리뷰 테이블 migration 누락 → deploy 중단)
      - name: V1 migration replay + drift gate
        env:
          PGPASSWORD: teameet_test
          MIGRATE_URL: postgresql://teameet_test:teameet_test@localhost:5432/v1_migrate_check
        run: |
          psql -h localhost -U teameet_test -d teameet_test -c "CREATE DATABASE v1_migrate_check;"
          cd apps/v1_api
          DATABASE_URL="$MIGRATE_URL" ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/prisma migrate diff \
            --from-url "$MIGRATE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          # Task 9 competition-config expand/contract split
          # (docs/ops/task9-competition-config-contract-phase.md): seeding and
          # backfill moved out of migration.sql (DML is never additive under
          # the expand-contract gate) into an app-level CLI. Mirrors what an
          # alpha deploy must also do after `prisma migrate deploy` — run it
          # here so `test:integration` sees the same DB state.
          DATABASE_URL="$MIGRATE_URL" ./node_modules/.bin/ts-node --transpile-only \
            src/tournaments/competition-config/competition-config-backfill.cli.ts
          DATABASE_URL="$MIGRATE_URL" pnpm test:integration
          # 게임 운영 플래그 불변 행 시드 CLI 가 실제로 기동하는지 확인한다
          # (배포 경로 deploy/deploy-alpha.sh 가 migrate deploy 직후 돌리는 그 CLI).
          # 잘못된 경로·깨진 import 처럼 "코드는 있는데 배선이 안 되는" 결함은 유닛
          # 테스트가 못 잡는다 — 워커 entrypoint 가 정확히 그렇게 몇 달을 죽어 있었다.
          #
          # 반드시 test:integration **뒤에** 둔다. 격리 스위트는 이 DB 를 템플릿으로
          # 클론하므로, 앞에 두면 시드된 행이 모든 클론에 전파돼
          # test/games/game-schema.integration-spec.ts 의 raw INSERT(GAME_READ)가
          # 23505 로 깨진다. 시드 로직 자체의 계약은 전용 통합 스펙
          # (test/tournaments/game-operation-flag-seed.integration-spec.ts)이 검증한다.
          DATABASE_URL="$MIGRATE_URL" ./node_modules/.bin/ts-node --transpile-only \
            src/config/game-operation-flags-seed.cli.ts
          echo "migration chain OK — empty-DB replay clean, zero schema drift"

      - name: V1 API unit tests
        run: pnpm --filter v1_api test

      - name: V1 API build check
        run: pnpm --filter v1_api build

      - name: Task 9 literal HTTP and DB manual QA
        timeout-minutes: 8
        run: >-
          node scripts/qa/task9-ci-manual-http.mjs
          --output-dir "${{ runner.temp }}/task9-ci-manual-http"

      - name: Upload Task 9 literal HTTP and DB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task9-ci-manual-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task9-ci-manual-http
          if-no-files-found: error
          retention-days: 14

  # ── Web: 린트·타입·유닛·빌드 ────────────────────────────────────────────────
  # v1_web 은 Prisma 클라이언트도 Postgres도 쓰지 않으므로 DB 서비스를 붙이지 않는다.
  web:
    name: Web
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: V1 web lint and type-check
        run: pnpm --filter v1_web lint

      - name: V1 web unit tests
        run: pnpm --filter v1_web test

      # Next.js 빌드 캐시(actions/cache)는 두지 않는다. Next 16 의 next build 는
      # apps/v1_web/.next/cache 를 거의 채우지 않아(측정값 95,532B) 복원해도 이득이 없는데,
      # 캐시 키에 커밋 SHA 가 들어가 커밋마다 빈 엔트리를 만들었다(233개 누적).
      - name: V1 web build check
        run: pnpm --filter v1_web build

  # ── Build images: 승인 게이트 앞에서 프로덕션 이미지를 만들어 둔다 ──────────
  # 승인 대기가 배포 시간의 대부분이었다(실측 29분). 빌드를 게이트 앞으로 옮기면
  # 승인 직후 남는 일은 activation + 마이그레이션·컨테이너 교체뿐이다.
  # (요구사항 1·2 — 러너가 빌드해 ECR digest 로 push, EC2 는 pull 만 한다. :latest 제거.)
  # 이 job 은 DB 와 실행 중인 컨테이너를 전혀 건드리지 않는다 — ECR 에 새 이미지를 올리고
  # EC2 의 고정 스테이징 경로(~/.teameet-prod-staging/<sha>)에 소스를 채워 두기만 한다
  # (D3). activation(symlink 스왑)은 승인 후 deploy job 이 한다 — 승인이 거부돼도 서비스는
  # 그대로 돌아간다.
  build-images:
    name: Build images
    needs: [gates, api, web]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 프로덕션 파이프라인 직렬화: 승인 대기 중인 릴리스가 있으면 다음 릴리스의 빌드도
    # 뒤에 큐잉된다 — 두 릴리스가 같은 호스트를 동시에 건드리는 상황을 막는다.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      # manifestSha256 은 실제로 S3 에 올라간 바이트를 해싱한 값이어야 한다 —
      # 업로드 스텝에서 계산해 내보낸다(생성 스텝이 아니라).
      manifestSha256: ${{ steps.manifest_upload.outputs.manifestSha256 }}
      manifestVersionId: ${{ steps.manifest_upload.outputs.manifestVersionId }}
      sourceSha256: ${{ steps.source.outputs.sourceSha256 }}
      sourceVersionId: ${{ steps.source.outputs.sourceVersionId }}
      releaseVersion: ${{ steps.version.outputs.stable }}

    steps:
      # fetch-depth: 0 필수 — "Resolve rollback compatibility base" 스텝이 호출하는
      # check-expand-contract-migrations.sh 는 migration_base_sha(수 커밋 전일 수 있음)와
      # 현재 SHA 사이 git history 를 직접 walk 한다. 얕은 checkout 이면 "unknown revision"
      # 으로 실패한다(alpha 의 deploy-alpha.yml 이 이미 동일한 이유로 fetch-depth: 0 사용).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION }}

      - name: Verify production AWS target
        id: target
        env:
          PROD_AWS_REGION: ${{ vars.PROD_AWS_REGION }}
          PROD_EXPECTED_ACCOUNT_ID: ${{ vars.PROD_EXPECTED_ACCOUNT_ID }}
          PROD_EC2_INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
        run: bash scripts/release/verify-prod-aws-target.sh

      - name: Sign in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Resolve rollback compatibility base
        id: rollback-base
        env:
          RELEASE_SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
        run: bash scripts/release/resolve-prod-rollback-base.sh

      - name: Resolve immutable image tags
        id: images
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          imageTag="sha-${RELEASE_SHA}"
          api_exists=false
          web_exists=false
          aws ecr describe-images --repository-name teameet-prod-v1-api \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && api_exists=true
          aws ecr describe-images --repository-name teameet-prod-v1-web \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && web_exists=true
          echo "imageTag=${imageTag}" >> "${GITHUB_OUTPUT}"
          echo "api_exists=${api_exists}" >> "${GITHUB_OUTPUT}"
          echo "web_exists=${web_exists}" >> "${GITHUB_OUTPUT}"

      # 이 릴리스의 stable SemVer 를 계산한다. prod 는 alpha 와 달리 prerelease 접미사가
      # 없다(§2-4) — Gates job 의 "Validate planned SemVer" 스텝과 같은 스크립트를 쓰되
      # stableVersion 만 취한다. X-Teameet-Release 헤더/manifest.release.version 양쪽에
      # 이 값을 쓴다.
      - name: Resolve stable release version
        id: version
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          release_date="$(git show -s --format=%cs "${RELEASE_SHA}")"
          metadata="$(node scripts/release/resolve-changeset-version.mjs \
            --repo . --sha "${RELEASE_SHA}" --date "${release_date}")"
          echo "stable=$(jq -er '.stableVersion' <<< "${metadata}")" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push immutable API image
        if: steps.images.outputs.api_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-api
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/teameet-prod-v1-api:${{ steps.images.outputs.imageTag }}
          cache-from: type=gha,scope=prod-v1-api
          cache-to: type=gha,mode=max,scope=prod-v1-api
          provenance: false
          sbom: false

      # 웹 이미지 빌드 인자 하나(INTERNAL_API_ORIGIN)만 EC2 .env 에서 읽는다. 승인 전
      # 단계라 .env 를 쓰지는 않는다 — 값만 조회한다.
      - name: Resolve internal API origin
        id: origin
        env:
          INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          # SSH 대신 SSM 으로 읽는다. 값이 없거나 조회가 실패하면 기본값으로 떨어진다 —
          # 이 값은 웹 이미지 빌드 인자일 뿐이라 조회 실패로 배포를 막지 않는다.
          origin=""
          cmd_id="$(aws ssm send-command --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript --comment "Teameet prod resolve internal api origin" \
            --parameters 'commands=["awk -F= '"'"'/^V1_INTERNAL_API_ORIGIN=/{sub(/^V1_INTERNAL_API_ORIGIN=/,\"\"); print; exit}'"'"' /home/ec2-user/teameet/deploy/.env 2>/dev/null || true"]' \
            --query 'Command.CommandId' --output text 2>/dev/null || true)"
          if [[ -n "${cmd_id}" ]]; then
            for _ in $(seq 1 20); do
              status="$(aws ssm get-command-invocation --command-id "${cmd_id}" \
                --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
              [[ "${status}" == "InProgress" || "${status}" == "Pending" || -z "${status}" ]] || break
              sleep 3
            done
            if [[ "${status:-}" == "Success" ]]; then
              origin="$(aws ssm get-command-invocation --command-id "${cmd_id}" \
                --instance-id "${INSTANCE_ID}" --query StandardOutputContent --output text 2>/dev/null | tr -d '\r\n' || true)"
            else
              echo "[prod-build] internal API origin 조회 실패(${status:-unknown}) — 기본값을 씁니다" >&2
            fi
          fi
          echo "internalApiOrigin=${origin:-http://v1_api:8121}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable Web image
        if: steps.images.outputs.web_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.v1-web
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/teameet-prod-v1-web:${{ steps.images.outputs.imageTag }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_ORIGIN=${{ steps.origin.outputs.internalApiOrigin }}
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_KAKAO_SCOPE=${{ vars.KAKAO_SCOPE }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_PROD }}
          cache-from: type=gha,scope=prod-v1-web
          cache-to: type=gha,mode=max,scope=prod-v1-web
          provenance: false
          sbom: false

      - name: Gate ECR critical findings
        env:
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
        run: bash scripts/release/check-prod-image-scans.sh

      # D2: S3 중계 없이 러너가 저장소를 EC2 의 고정 스테이징 경로로 직접 rsync 한다.
      # 이 스텝은 아직 어떤 release-sha 도 활성화하지 않는다 — activation(symlink 스왑)은
      # 승인 이후 deploy job 의 deploy-prod.sh 책임이다(D3).
      - name: Upload release source to S3
        id: source
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_BUCKET: ${{ vars.PROD_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ vars.PROD_EXPECTED_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          # SSH/rsync 대신 러너에서 tarball 을 만들어 S3 로 올린다(alpha 와 동일 구조).
          # EC2 는 배포 시점에 SSM 명령으로 이 객체를 내려받아 푼다 — 인바운드 포트도,
          # 저장소가 보관하는 장기 사설키도 필요 없어진다.
          archive="${RUNNER_TEMP}/teameet-prod-${RELEASE_SHA}.tar.gz"
          # --sort=name + 고정 mtime/uid/gid 로 재현 가능한 tarball 을 만든다. 같은 트리면
          # 같은 sha256 이 나와야 재배포·검증이 성립한다.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='UTC 2020-01-01' \
            --exclude=./node_modules --exclude=./.next --exclude=./dist --exclude=./.git \
            --exclude=./backups --exclude=./deploy/certbot --exclude=./deploy/.env \
            --exclude=./deploy/release-metadata.prod.conf \
            -czf "${archive}" -C . .
          # R8: sourceSha256 은 실제로 업로드되는 바이트를 그대로 해싱한다 — 별도 재구성값이
          # 아니므로 exclude 목록과 어긋날 여지가 없다.
          source_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          if [[ ! "${source_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to compute sourceSha256 from ${archive} (got: '${source_sha256}')" >&2
            exit 1
          fi
          source_version_id="$(aws s3api put-object \
            --bucket "${DEPLOY_BUCKET}" --key "releases/${RELEASE_SHA}.tar.gz" \
            --body "${archive}" --expected-bucket-owner "${EXPECTED_BUCKET_OWNER}" \
            --query 'VersionId' --output text)"
          if [[ -z "${source_version_id}" || "${source_version_id}" == "None" ]]; then
            echo "S3 put-object did not return a VersionId — 버킷 버전 관리가 켜져 있는지 확인하세요" >&2
            exit 1
          fi
          echo "sourceSha256=${source_sha256}" >> "${GITHUB_OUTPUT}"
          echo "sourceVersionId=${source_version_id}" >> "${GITHUB_OUTPUT}"

      - name: Create release manifest
        id: manifest
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.stable }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOURCE_SHA256: ${{ steps.source.outputs.sourceSha256 }}
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
          PREVIOUS_SHA: ${{ steps.rollback-base.outputs.previousSha }}
          MIGRATION_BASE_SHA: ${{ steps.rollback-base.outputs.migrationBaseSha }}
        run: bash scripts/release/create-prod-release-manifest.sh

      - name: Upload release manifest to S3
        id: manifest_upload
        env:
          RELEASE_SHA: ${{ github.sha }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifestPath }}
          DEPLOY_BUCKET: ${{ vars.PROD_DEPLOY_BUCKET }}
          EXPECTED_BUCKET_OWNER: ${{ vars.PROD_EXPECTED_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          # 매니페스트도 소스와 같은 버킷에 버전 고정으로 올린다. EC2 는 배포 시점에
          # version-id 로 정확히 이 객체를 받고 sha256 으로 대조한다 — 중간에 바꿔치기해도
          # 검증에서 걸린다.
          manifest_sha256="$(sha256sum "${MANIFEST_PATH}" | awk '{print $1}')"
          if [[ ! "${manifest_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to compute manifestSha256 from ${MANIFEST_PATH}" >&2
            exit 1
          fi
          manifest_version_id="$(aws s3api put-object \
            --bucket "${DEPLOY_BUCKET}" --key "manifests/${RELEASE_SHA}.json" \
            --body "${MANIFEST_PATH}" --expected-bucket-owner "${EXPECTED_BUCKET_OWNER}" \
            --query 'VersionId' --output text)"
          if [[ -z "${manifest_version_id}" || "${manifest_version_id}" == "None" ]]; then
            echo "S3 put-object did not return a VersionId — 버킷 버전 관리 확인 필요" >&2
            exit 1
          fi
          echo "manifestSha256=${manifest_sha256}" >> "${GITHUB_OUTPUT}"
          echo "manifestVersionId=${manifest_version_id}" >> "${GITHUB_OUTPUT}"

  # ── Deploy job: 승인 후 activation + 마이그레이션 + 컨테이너 교체만 수행 ───────
  deploy:
    name: Deploy
    needs: build-images
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 수동 승인 게이트: production environment의 required reviewer가
    # GitHub UI에서 승인해야 배포가 시작된다 (main push 자동 배포 제거)
    environment: production
    # 프로덕션 배포 직렬화: 진행 중 배포는 취소하지 않고 뒤에 큐잉
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # 이 job 의 세 스텝은 전부 aws CLI(ssm put-parameter / send-command)를 호출한다.
    # 워크플로 기본값은 contents: read 뿐이라 여기서 OIDC 토큰을 따로 요청해야 한다.
    permissions:
      contents: read
      id-token: write

    steps:
      # SSH → SSM 전환에서 "Setup SSH" 스텝을 걷어낼 때 checkout 과 AWS 자격증명 스텝이
      # 함께 빠졌다. 그 결과 첫 승인 배포가 "sync-prod-runtime-env.sh: No such file or
      # directory"(exit 127) 로 죽었다 — 이 job 은 러너에 리포도, 자격증명도 없이 시작한다.
      # build-images 와 달리 git history 를 walk 하는 스크립트가 없으므로 얕은 checkout 으로
      # 충분하다(여기서 도는 스크립트는 S3 에 올라간 소스를 SSM 으로 내려받게 시킬 뿐이다).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION }}

      # 런타임 시크릿은 Parameter Store(SecureString) 를 거쳐 전달한다.
      # SSM send-command 의 파라미터는 CloudTrail 과 명령 이력에 남으므로 시크릿을 명령
      # 문자열에 실을 수 없다. 값은 KMS 로 암호화해 Parameter Store 에 올리고, 명령에는
      # 경로만 실어 보낸다 — 인스턴스가 자기 IAM role 로 복호화해 .env 를 재구성한다.
      - name: Sync runtime env
        env:
          INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.PROD_AWS_REGION }}
          # compose 가 기본값 없이 참조하는 뿌리 변수 두 개. 값이 없으면 compose 는 빈
          # 문자열로 치환하고 ${V1_JWT_SECRET:-${JWT_SECRET}} 같은 중첩 기본값까지 전부
          # 비어서, 빈 JWT 서명 비밀키로 배포될 수 있다(2026-08-02 실사고 — DB 인증 실패가
          # 먼저 나서 그 상태로 뜨지는 않았다). 지금은 Parameter Store 에만 값이 있는데,
          # 여기에 걸어 두면 시크릿을 등록하는 순간 GitHub 이 단일 출처가 된다.
          # 등록 전이라도 안전하다 — sync 스크립트는 빈 값을 건너뛰므로(빈 값이라 건너뜀
          # 카운터) 기존 Parameter Store 값을 지우지 않는다.
          SECRET_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRET_KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          SECRET_KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          SECRET_KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          SECRET_KAKAO_SCOPE: ${{ vars.KAKAO_SCOPE }}
          SECRET_V1_HOST_ADMIN_PASSWORD: ${{ secrets.V1_HOST_ADMIN_PASSWORD }}
          SECRET_GA_MEASUREMENT_ID: ${{ secrets.GA_PROD }}
          SECRET_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SECRET_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SECRET_VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SECRET_SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SECRET_SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SECRET_SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SECRET_SOLAPI_SENDER_NUMBER: ${{ secrets.SOLAPI_SENDER_NUMBER }}
          SECRET_GABIA_SMS_ID: ${{ secrets.GABIA_SMS_ID }}
          SECRET_GABIA_API_KEY: ${{ secrets.GABIA_API_KEY }}
          SECRET_GABIA_SENDER_NUMBER: ${{ secrets.GABIA_SENDER_NUMBER }}
          SECRET_SES_REGION: ${{ vars.SES_REGION }}
          SECRET_EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SECRET_SLACK_INQUIRY_WEBHOOK_URL: ${{ secrets.SLACK_INQUIRY_WEBHOOK_URL }}
        run: bash scripts/release/sync-prod-runtime-env.sh

      - name: Run deploy-prod.sh
        timeout-minutes: 20
        env:
          PROD_SHA: ${{ github.sha }}
          PROD_MANIFEST_SHA256: ${{ needs.build-images.outputs.manifestSha256 }}
          PROD_RELEASE_VERSION: ${{ needs.build-images.outputs.releaseVersion }}
          PROD_ECR_REGISTRY: ${{ needs.build-images.outputs.registry }}
          PROD_AWS_REGION: ${{ vars.PROD_AWS_REGION }}
          PROD_SOURCE_SHA256: ${{ needs.build-images.outputs.sourceSha256 }}
          PROD_SOURCE_VERSION_ID: ${{ needs.build-images.outputs.sourceVersionId }}
          PROD_MANIFEST_VERSION_ID: ${{ needs.build-images.outputs.manifestVersionId }}
          PROD_DEPLOY_BUCKET: ${{ vars.PROD_DEPLOY_BUCKET }}
          PROD_EXPECTED_ACCOUNT_ID: ${{ vars.PROD_EXPECTED_ACCOUNT_ID }}
          PROD_EC2_INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          # SSH 대신 SSM. 스크립트가 S3 에서 소스·매니페스트를 내려받아 sha256 으로 대조한 뒤
          # deploy-prod.sh 를 실행한다. 시크릿은 명령 파라미터에 들어가지 않는다.
          RELEASE_SHA="${PROD_SHA}" \
          RELEASE_VERSION="${PROD_RELEASE_VERSION}" \
          DEPLOY_BUCKET="${PROD_DEPLOY_BUCKET}" \
          EXPECTED_BUCKET_OWNER="${PROD_EXPECTED_ACCOUNT_ID}" \
          INSTANCE_ID="${PROD_EC2_INSTANCE_ID}" \
          SOURCE_VERSION_ID="${PROD_SOURCE_VERSION_ID}" \
          SOURCE_SHA256="${PROD_SOURCE_SHA256}" \
          MANIFEST_VERSION_ID="${PROD_MANIFEST_VERSION_ID}" \
          MANIFEST_SHA256="${PROD_MANIFEST_SHA256}" \
          REGISTRY="${PROD_ECR_REGISTRY}" \
          AWS_REGION="${PROD_AWS_REGION}" \
            bash scripts/release/deploy-prod-via-ssm.sh

      # deploy-prod.sh 는 EC2 안에서 이미 wait_for_prod_health_contract 로 로컬 헬스를
      # 확인한 뒤에만 성공 리턴한다. 여기서는 "EC2 로컬은 성공했지만 네트워크 경로 문제로
      # 퍼블릭엔 아직 안 나온" 케이스를 잡기 위해 러너에서 한 번 더 확인한다(요구사항 5).
      - name: Health check
        env:
          INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
          RELEASE_VERSION: ${{ needs.build-images.outputs.releaseVersion }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # ① 인스턴스 내부 계약 검사(기존 SSH 검사와 동일 내용)를 SSM 으로 실행한다.
          health_script=$(cat <<'REMOTE'
          set -Eeuo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 http://localhost:8121/api/v1/health |
            jq -e '.data.checks.db == true' >/dev/null
          test "$(sudo docker inspect --format '{{.State.Health.Status}}' teameet_v1_game_operations_worker)" = "healthy"
          test "$(curl -sS --connect-timeout 5 --max-time 15 --resolve teameet.co.kr:443:127.0.0.1 \
            -o /dev/null -w '%{http_code}' https://teameet.co.kr/landing)" = "200"
          curl -fsS --connect-timeout 5 --max-time 15 --resolve teameet.co.kr:443:127.0.0.1 \
            https://teameet.co.kr/api/v1/health | jq -e '.data.checks.db == true' >/dev/null
          test "$(curl -sS --connect-timeout 5 --max-time 15 --resolve teameet.co.kr:443:127.0.0.1 \
            -o /dev/null -w '%{http_code}' https://teameet.co.kr/v1/home)" = "308"
          echo LOCAL_HEALTH_OK
          REMOTE
          )
          params="$(jq -nc --arg s "${health_script}" '{commands:[$s]}')"
          ok=false
          for i in $(seq 1 12); do
            cid="$(aws ssm send-command --instance-ids "${INSTANCE_ID}" \
              --document-name AWS-RunShellScript --comment "Teameet prod health ${RELEASE_SHA}" \
              --parameters "${params}" --query 'Command.CommandId' --output text)"
            for _ in $(seq 1 20); do
              st="$(aws ssm get-command-invocation --command-id "${cid}" \
                --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
              [[ "${st}" == "InProgress" || "${st}" == "Pending" || -z "${st}" ]] || break
              sleep 3
            done
            if [[ "${st:-}" == "Success" ]]; then ok=true; break; fi
            echo "Attempt ${i}/12 — 아직 준비되지 않았습니다(${st:-unknown}), 10초 후 재시도..."
            sleep 10
          done
          if [[ "${ok}" != true ]]; then
            echo "인스턴스 내부 헬스 계약이 통과하지 못했습니다" >&2
            aws ssm get-command-invocation --command-id "${cid}" --instance-id "${INSTANCE_ID}" \
              --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json >&2 || true
            exit 1
          fi

          # ② 러너에서 퍼블릭 경로를 직접 확인한다. ①은 --resolve 로 루프백을 강제하므로
          #    ALB·DNS·인증서 경로가 실제로 새 릴리스를 내보내는지는 검증하지 못한다.
          #    릴리스 헤더까지 대조해야 "옛 컨테이너가 응답해서 통과"하는 것을 배제할 수 있다.
          for i in $(seq 1 12); do
            served="$(curl -fsSI --connect-timeout 5 --max-time 15 https://teameet.co.kr/ 2>/dev/null |
              awk -F': ' 'tolower($1)=="x-teameet-commit"{gsub("\r","",$2); print $2}')"
            if [[ "${served}" == "${RELEASE_SHA}" ]]; then
              echo "Deploy OK — 퍼블릭 응답이 ${RELEASE_VERSION} (${RELEASE_SHA}) 입니다"
              exit 0
            fi
            echo "Attempt ${i}/12 — 퍼블릭 응답이 아직 '${served:-없음}' 입니다, 10초 후 재시도..."
            sleep 10
          done
          echo "Deploy FAILED — 퍼블릭 경로가 새 릴리스를 내보내지 않습니다" >&2
          exit 1
