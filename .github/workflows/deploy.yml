name: CI / Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# PR 간 상호 취소 방지: 그룹을 PR/ref 단위로 분리
# - pull_request: 같은 PR의 이전 attempt만 취소 (ci-pr-N)
# - main push · workflow_dispatch: 취소 없이 직렬 큐
# 프로덕션 배포 직렬화는 build-images/deploy job의 job-level concurrency가 담당
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gates: 릴리스 계약 검사 ─────────────────────────────────────────────────
  # DB도 앱 빌드도 필요 없는 초 단위 검사라 api/web 과 병렬로 돌린다.
  gates:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release changeset
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git merge-base origin/main "${HEAD_SHA}")"
          fi
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > /tmp/teameet-changed-files.txt
          node scripts/release/check-changeset-policy.mjs \
            --repo . \
            --changed-files-file /tmp/teameet-changed-files.txt

      - name: Validate planned SemVer
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        env:
          RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            release_date="$(git show -s --format=%cs "${RELEASE_SHA}")"
            node scripts/release/resolve-changeset-version.mjs \
              --repo . \
              --sha "${RELEASE_SHA}" \
              --date "${release_date}" |
              jq -e '.stableVersion and .prereleaseVersion'
          else
            echo "No unreleased Changesets; planned release validation skipped"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: V1 DB guardrails
        run: pnpm qa:v1-db-guardrails

      - name: Production deploy security guardrails
        run: pnpm qa:production-deploy-security

      # 이 스위트는 존재만 하고 CI 에서 한 번도 실행되지 않았다 — 그래서
      # "changeset 을 전부 소비하면 alpha 배포가 깨진다"는 계약 위반이 계속 살아 있었다.
      # 디렉터리 인자(`node --test scripts/release/`)는 Node 버전에 따라 모듈 해석으로
      # 넘어가므로 파일을 명시한다.
      - name: Release contract tests
        run: node --test scripts/release/versioning.contract.test.mjs

      - name: Alpha release-state contract tests
        run: bash scripts/qa/test-alpha-release-state.sh

      # prod 배포 경로는 main push 때만 도는 탓에 몇 주씩 검증되지 않는다 — 그래서
      # prune_stale_release_tags 의 빈 입력 버그가 2026-08-01 배포에서야 터졌다(#220).
      # 이번 변경으로 EC2 가 더 이상 로컬 docker build 를 하지 않고 ECR digest 를 pull 만
      # 하므로(요구사항 1·2) 그 함수가 지키던 문제 자체가 사라져 함수와 이 테스트를 제거
      # 했다 — 대신 alpha 와 동일한 candidate→promote 상태 기계장치 계약 테스트로 교체한다.
      # 이 스텝도 모든 PR·push 에서 돌아 같은 계열(main push 전용 경로가 몇 주씩 검증되지
      # 않는) 버그를 배포 전에 잡는다.
      - name: Prod release-state contract tests
        run: bash scripts/qa/test-prod-release-state.sh

      # rollback-prod.sh 는 지금까지 어떤 CI 에서도 실행된 적이 없고, 유일한 실행처가
      # 라이브 프로덕션 EC2 였다 — 즉 "처음 롤백이 필요한 순간" 이 사실상 첫 실행이다.
      # 롤백은 이미 뭔가 잘못된 상황에서만 쓰는 경로라, 그때 처음 버그를 만나면 복구 수단이
      # 통째로 없는 것과 같다. 최소한 진입 가드만이라도 매 push 에서 실제 실행해 확인한다.
      # (런타임 오케스트레이션 전체는 실제 EC2 리허설이 필요하다 — 이 테스트의 범위 밖이다.)
      - name: Prod rollback guard tests
        run: bash scripts/qa/test-prod-rollback-guards.sh

  # ── API: 타입·마이그레이션·유닛·통합·빌드 ───────────────────────────────────
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teameet_test
          POSTGRES_PASSWORD: teameet_test
          POSTGRES_DB: teameet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teameet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://teameet_test:teameet_test@localhost:5432/teameet_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate V1 Prisma client
        run: cd apps/v1_api && pnpm prisma generate

      - name: V1 API type-check
        run: pnpm --filter v1_api exec tsc --noEmit

      # 마이그레이션 게이트: 빈 DB에 전체 체인 재생 + schema.prisma 드리프트 0 검증.
      # db push로만 스키마를 바꾸면 여기서 CI가 깨진다 — 반드시 migration 파일 동반.
      # (2026-07-12 프로덕션 장애 재발 방지: 리뷰 테이블 migration 누락 → deploy 중단)
      - name: V1 migration replay + drift gate
        env:
          PGPASSWORD: teameet_test
          MIGRATE_URL: postgresql://teameet_test:teameet_test@localhost:5432/v1_migrate_check
        run: |
          psql -h localhost -U teameet_test -d teameet_test -c "CREATE DATABASE v1_migrate_check;"
          cd apps/v1_api
          DATABASE_URL="$MIGRATE_URL" ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/prisma migrate diff \
            --from-url "$MIGRATE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          DATABASE_URL="$MIGRATE_URL" pnpm test:integration
          echo "migration chain OK — empty-DB replay clean, zero schema drift"

      - name: V1 API unit tests
        run: pnpm --filter v1_api test

      - name: V1 API build check
        run: pnpm --filter v1_api build

  # ── Web: 린트·타입·유닛·빌드 ────────────────────────────────────────────────
  # v1_web 은 Prisma 클라이언트도 Postgres도 쓰지 않으므로 DB 서비스를 붙이지 않는다.
  web:
    name: Web
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: V1 web lint and type-check
        run: pnpm --filter v1_web lint

      - name: V1 web unit tests
        run: pnpm --filter v1_web test

      # Next.js 빌드 캐시(actions/cache)는 두지 않는다. Next 16 의 next build 는
      # apps/v1_web/.next/cache 를 거의 채우지 않아(측정값 95,532B) 복원해도 이득이 없는데,
      # 캐시 키에 커밋 SHA 가 들어가 커밋마다 빈 엔트리를 만들었다(233개 누적).
      - name: V1 web build check
        run: pnpm --filter v1_web build

  # ── Build images: 승인 게이트 앞에서 프로덕션 이미지를 만들어 둔다 ──────────
  # 승인 대기가 배포 시간의 대부분이었다(실측 29분). 빌드를 게이트 앞으로 옮기면
  # 승인 직후 남는 일은 activation + 마이그레이션·컨테이너 교체뿐이다.
  # (요구사항 1·2 — 러너가 빌드해 ECR digest 로 push, EC2 는 pull 만 한다. :latest 제거.)
  # 이 job 은 DB 와 실행 중인 컨테이너를 전혀 건드리지 않는다 — ECR 에 새 이미지를 올리고
  # EC2 의 고정 스테이징 경로(~/.teameet-prod-staging/<sha>)에 소스를 채워 두기만 한다
  # (D3). activation(symlink 스왑)은 승인 후 deploy job 이 한다 — 승인이 거부돼도 서비스는
  # 그대로 돌아간다.
  build-images:
    name: Build images
    needs: [gates, api, web]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 프로덕션 파이프라인 직렬화: 승인 대기 중인 릴리스가 있으면 다음 릴리스의 빌드도
    # 뒤에 큐잉된다 — 두 릴리스가 같은 호스트를 동시에 건드리는 상황을 막는다.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      manifestSha256: ${{ steps.manifest.outputs.manifestSha256 }}
      sourceSha256: ${{ steps.source.outputs.sourceSha256 }}
      releaseVersion: ${{ steps.version.outputs.stable }}

    steps:
      # fetch-depth: 0 필수 — "Resolve rollback compatibility base" 스텝이 호출하는
      # check-expand-contract-migrations.sh 는 migration_base_sha(수 커밋 전일 수 있음)와
      # 현재 SHA 사이 git history 를 직접 walk 한다. 얕은 checkout 이면 "unknown revision"
      # 으로 실패한다(alpha 의 deploy-alpha.yml 이 이미 동일한 이유로 fetch-depth: 0 사용).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION }}

      - name: Verify production AWS target
        id: target
        env:
          PROD_AWS_REGION: ${{ vars.PROD_AWS_REGION }}
          PROD_EXPECTED_ACCOUNT_ID: ${{ vars.PROD_EXPECTED_ACCOUNT_ID }}
          PROD_EC2_INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
        run: bash scripts/release/verify-prod-aws-target.sh

      - name: Sign in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${EC2_HOST}" || -z "${EC2_KNOWN_HOSTS}" || -z "${EC2_SSH_KEY}" ]]; then
            echo "EC2_HOST, EC2_KNOWN_HOSTS, and EC2_SSH_KEY are required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${EC2_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 400 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "${EC2_HOST}" -f ~/.ssh/known_hosts >/dev/null; then
            echo "EC2_KNOWN_HOSTS does not contain the configured EC2_HOST" >&2
            exit 1
          fi
          cat >> ~/.ssh/config << EOF
          Host ec2
            HostName ${EC2_HOST}
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Resolve rollback compatibility base
        id: rollback-base
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/release/resolve-prod-rollback-base.sh

      - name: Resolve immutable image tags
        id: images
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          imageTag="sha-${RELEASE_SHA}"
          api_exists=false
          web_exists=false
          aws ecr describe-images --repository-name teameet-prod-v1-api \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && api_exists=true
          aws ecr describe-images --repository-name teameet-prod-v1-web \
            --image-ids "imageTag=${imageTag}" >/dev/null 2>&1 && web_exists=true
          echo "imageTag=${imageTag}" >> "${GITHUB_OUTPUT}"
          echo "api_exists=${api_exists}" >> "${GITHUB_OUTPUT}"
          echo "web_exists=${web_exists}" >> "${GITHUB_OUTPUT}"

      # 이 릴리스의 stable SemVer 를 계산한다. prod 는 alpha 와 달리 prerelease 접미사가
      # 없다(§2-4) — Gates job 의 "Validate planned SemVer" 스텝과 같은 스크립트를 쓰되
      # stableVersion 만 취한다. X-Teameet-Release 헤더/manifest.release.version 양쪽에
      # 이 값을 쓴다.
      - name: Resolve stable release version
        id: version
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          release_date="$(git show -s --format=%cs "${RELEASE_SHA}")"
          metadata="$(node scripts/release/resolve-changeset-version.mjs \
            --repo . --sha "${RELEASE_SHA}" --date "${release_date}")"
          echo "stable=$(jq -er '.stableVersion' <<< "${metadata}")" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push immutable API image
        if: steps.images.outputs.api_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.v1-api
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/teameet-prod-v1-api:${{ steps.images.outputs.imageTag }}
          cache-from: type=gha,scope=prod-v1-api
          cache-to: type=gha,mode=max,scope=prod-v1-api
          provenance: false
          sbom: false

      # 웹 이미지 빌드 인자 하나(INTERNAL_API_ORIGIN)만 EC2 .env 에서 읽는다. 승인 전
      # 단계라 .env 를 쓰지는 않는다 — 값만 조회하는 짧은 SSH 조회다(기존 로직 이식).
      - name: Resolve internal API origin
        id: origin
        run: |
          set -Eeuo pipefail
          origin="$(ssh ec2 "awk -F= '/^V1_INTERNAL_API_ORIGIN=/{sub(/^V1_INTERNAL_API_ORIGIN=/,\"\"); print; exit}' ~/teameet/deploy/.env" || true)"
          echo "internalApiOrigin=${origin:-http://v1_api:8121}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable Web image
        if: steps.images.outputs.web_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.v1-web
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/teameet-prod-v1-web:${{ steps.images.outputs.imageTag }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_ORIGIN=${{ steps.origin.outputs.internalApiOrigin }}
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_KAKAO_SCOPE=${{ vars.KAKAO_SCOPE }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_PROD }}
          cache-from: type=gha,scope=prod-v1-web
          cache-to: type=gha,mode=max,scope=prod-v1-web
          provenance: false
          sbom: false

      - name: Gate ECR critical findings
        env:
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
        run: bash scripts/release/check-prod-image-scans.sh

      # D2: S3 중계 없이 러너가 저장소를 EC2 의 고정 스테이징 경로로 직접 rsync 한다.
      # 이 스텝은 아직 어떤 release-sha 도 활성화하지 않는다 — activation(symlink 스왑)은
      # 승인 이후 deploy job 의 deploy-prod.sh 책임이다(D3).
      - name: Stage release source on EC2
        id: source
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          staging="~/.teameet-prod-staging/${RELEASE_SHA}"
          ssh ec2 "mkdir -p ${staging}"
          rsync -avz --delete \
            --exclude node_modules --exclude .next --exclude dist --exclude .git \
            --exclude backups --exclude 'deploy/certbot' --exclude 'deploy/.env' \
            --exclude 'deploy/release-metadata.prod.conf' \
            -e ssh ./ "ec2:${staging}/"
          # R8: sourceSha256 은 EC2 로 실제 전송된 바이트를 그대로 재해싱한다(별도 재구성값이
          # 아니다) — rsync exclude 목록과 어긋날 수 있는 값을 신뢰하지 않는다.
          # 원격 커맨드를 문자열로 넘기면 로컬 set -e 는 ssh 자체의 종료코드만 본다. 그런데
          # 그 안이 파이프라인이라 tar 가 실패해도 sha256sum 이 0 으로 끝나면 ssh 도 0 이 되어
          # **빈 입력의 해시**가 정상값처럼 흘러간다. 원격에서도 pipefail 을 켜 tar 실패를
          # 전파시키고, awk 는 로컬로 옮겨 원격 문자열의 $1 이스케이프 지옥을 없앤다.
          source_sha256="$(ssh ec2 "set -o pipefail; tar --sort=name -C '${staging}' -cf - . | sha256sum")"
          source_sha256="${source_sha256%% *}"
          # 형식 검증까지 해야 위 pipefail 이 어떤 이유로든 안 걸렸을 때도 빈 값/쓰레기가
          # 매니페스트에 박히지 않는다.
          if [[ ! "${source_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to compute sourceSha256 from ${staging} (got: '${source_sha256}')" >&2
            exit 1
          fi
          echo "sourceSha256=${source_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Create release manifest
        id: manifest
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.stable }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOURCE_SHA256: ${{ steps.source.outputs.sourceSha256 }}
          IMAGE_TAG: ${{ steps.images.outputs.imageTag }}
          PREVIOUS_SHA: ${{ steps.rollback-base.outputs.previousSha }}
          MIGRATION_BASE_SHA: ${{ steps.rollback-base.outputs.migrationBaseSha }}
        run: bash scripts/release/create-prod-release-manifest.sh

      - name: Copy release manifest onto EC2 staging
        env:
          RELEASE_SHA: ${{ github.sha }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifestPath }}
        run: |
          set -Eeuo pipefail
          ssh ec2 "mkdir -p ~/.teameet-prod-staging/${RELEASE_SHA}/deploy"
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${MANIFEST_PATH}" "ec2:~/.teameet-prod-staging/${RELEASE_SHA}/deploy/release-manifest.json"

  # ── Deploy job: 승인 후 activation + 마이그레이션 + 컨테이너 교체만 수행 ───────
  deploy:
    name: Deploy
    needs: build-images
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 수동 승인 게이트: production environment의 required reviewer가
    # GitHub UI에서 승인해야 배포가 시작된다 (main push 자동 배포 제거)
    environment: production
    # 프로덕션 배포 직렬화: 진행 중 배포는 취소하지 않고 뒤에 큐잉
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${EC2_HOST}" || -z "${EC2_KNOWN_HOSTS}" || -z "${EC2_SSH_KEY}" ]]; then
            echo "EC2_HOST, EC2_KNOWN_HOSTS, and EC2_SSH_KEY are required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${EC2_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 400 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "${EC2_HOST}" -f ~/.ssh/known_hosts >/dev/null; then
            echo "EC2_KNOWN_HOSTS does not contain the configured EC2_HOST" >&2
            exit 1
          fi
          cat >> ~/.ssh/config << EOF
          Host ec2
            HostName ${EC2_HOST}
            User ec2-user
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      # 승인된 릴리스만 런타임 설정에 반영한다. 예전에는 이 스텝이 :latest 승격 +
      # migrate 까지 겸했지만, 이제 그 책임은 deploy-prod.sh(D3) 로 옮겼다 — 여기서는
      # 시크릿을 고정 런타임 경로(~/.teameet-prod-runtime/.env)에 동기화만 한다.
      - name: Sync runtime env
        timeout-minutes: 5
        env:
          RELEASE_SHA: ${{ github.sha }}
          KAKAO_CLIENT_ID_SECRET: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI_SECRET: ${{ secrets.KAKAO_REDIRECT_URI }}
          # 공개 동의항목 목록이라 시크릿이 아닌 repository variable.
          KAKAO_SCOPE_SECRET: ${{ vars.KAKAO_SCOPE }}
          V1_HOST_ADMIN_PASSWORD_SECRET: ${{ secrets.V1_HOST_ADMIN_PASSWORD }}
          GA_MEASUREMENT_ID_SECRET: ${{ secrets.GA_PROD }}
          VAPID_PUBLIC_KEY_SECRET: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY_SECRET: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT_SECRET: ${{ secrets.VAPID_SUBJECT }}
          # 휴대폰 SMS OTP 발송처. 솔라피·가비아 양쪽을 모두 주입하고 SMS_PROVIDER
          # 플래그로만 전환한다.
          SMS_PROVIDER_SECRET: ${{ secrets.SMS_PROVIDER }}
          SOLAPI_API_KEY_SECRET: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_SENDER_NUMBER_SECRET: ${{ secrets.SOLAPI_SENDER_NUMBER }}
          GABIA_SMS_ID_SECRET: ${{ secrets.GABIA_SMS_ID }}
          GABIA_API_KEY_SECRET: ${{ secrets.GABIA_API_KEY }}
          GABIA_SENDER_NUMBER_SECRET: ${{ secrets.GABIA_SENDER_NUMBER }}
          # 이메일 OTP 발송처(SesEmailSender). 값이 공개 설정이라 시크릿이 아닌
          # repository variable 이다.
          SES_REGION_SECRET: ${{ vars.SES_REGION }}
          EMAIL_FROM_SECRET: ${{ vars.EMAIL_FROM }}
        run: |
          KAKAO_CLIENT_ID_B64="$(printf '%s' "${KAKAO_CLIENT_ID_SECRET:-}" | base64 | tr -d '\n')"
          KAKAO_CLIENT_SECRET_B64="$(printf '%s' "${KAKAO_CLIENT_SECRET_SECRET:-}" | base64 | tr -d '\n')"
          KAKAO_REDIRECT_URI_B64="$(printf '%s' "${KAKAO_REDIRECT_URI_SECRET:-}" | base64 | tr -d '\n')"
          KAKAO_SCOPE_B64="$(printf '%s' "${KAKAO_SCOPE_SECRET:-}" | base64 | tr -d '\n')"
          V1_HOST_ADMIN_PASSWORD_B64="$(printf '%s' "${V1_HOST_ADMIN_PASSWORD_SECRET:-}" | base64 | tr -d '\n')"
          GA_MEASUREMENT_ID_B64="$(printf '%s' "${GA_MEASUREMENT_ID_SECRET:-}" | base64 | tr -d '\n')"
          VAPID_PUBLIC_KEY_B64="$(printf '%s' "${VAPID_PUBLIC_KEY_SECRET:-}" | base64 | tr -d '\n')"
          VAPID_PRIVATE_KEY_B64="$(printf '%s' "${VAPID_PRIVATE_KEY_SECRET:-}" | base64 | tr -d '\n')"
          VAPID_SUBJECT_B64="$(printf '%s' "${VAPID_SUBJECT_SECRET:-}" | base64 | tr -d '\n')"
          SMS_PROVIDER_B64="$(printf '%s' "${SMS_PROVIDER_SECRET:-}" | base64 | tr -d '\n')"
          SOLAPI_API_KEY_B64="$(printf '%s' "${SOLAPI_API_KEY_SECRET:-}" | base64 | tr -d '\n')"
          SOLAPI_API_SECRET_B64="$(printf '%s' "${SOLAPI_API_SECRET_SECRET:-}" | base64 | tr -d '\n')"
          SOLAPI_SENDER_NUMBER_B64="$(printf '%s' "${SOLAPI_SENDER_NUMBER_SECRET:-}" | base64 | tr -d '\n')"
          GABIA_SMS_ID_B64="$(printf '%s' "${GABIA_SMS_ID_SECRET:-}" | base64 | tr -d '\n')"
          GABIA_API_KEY_B64="$(printf '%s' "${GABIA_API_KEY_SECRET:-}" | base64 | tr -d '\n')"
          GABIA_SENDER_NUMBER_B64="$(printf '%s' "${GABIA_SENDER_NUMBER_SECRET:-}" | base64 | tr -d '\n')"
          SES_REGION_B64="$(printf '%s' "${SES_REGION_SECRET:-}" | base64 | tr -d '\n')"
          EMAIL_FROM_B64="$(printf '%s' "${EMAIL_FROM_SECRET:-}" | base64 | tr -d '\n')"

          {
            printf 'RELEASE_SHA=%s\n' "${RELEASE_SHA}"
            printf 'KAKAO_CLIENT_ID_B64=%s\n' "${KAKAO_CLIENT_ID_B64}"
            printf 'KAKAO_CLIENT_SECRET_B64=%s\n' "${KAKAO_CLIENT_SECRET_B64}"
            printf 'KAKAO_REDIRECT_URI_B64=%s\n' "${KAKAO_REDIRECT_URI_B64}"
            printf 'KAKAO_SCOPE_B64=%s\n' "${KAKAO_SCOPE_B64}"
            printf 'V1_HOST_ADMIN_PASSWORD_B64=%s\n' "${V1_HOST_ADMIN_PASSWORD_B64}"
            printf 'GA_MEASUREMENT_ID_B64=%s\n' "${GA_MEASUREMENT_ID_B64}"
            printf 'VAPID_PUBLIC_KEY_B64=%s\n' "${VAPID_PUBLIC_KEY_B64}"
            printf 'VAPID_PRIVATE_KEY_B64=%s\n' "${VAPID_PRIVATE_KEY_B64}"
            printf 'VAPID_SUBJECT_B64=%s\n' "${VAPID_SUBJECT_B64}"
            printf 'SMS_PROVIDER_B64=%s\n' "${SMS_PROVIDER_B64}"
            printf 'SOLAPI_API_KEY_B64=%s\n' "${SOLAPI_API_KEY_B64}"
            printf 'SOLAPI_API_SECRET_B64=%s\n' "${SOLAPI_API_SECRET_B64}"
            printf 'SOLAPI_SENDER_NUMBER_B64=%s\n' "${SOLAPI_SENDER_NUMBER_B64}"
            printf 'GABIA_SMS_ID_B64=%s\n' "${GABIA_SMS_ID_B64}"
            printf 'GABIA_API_KEY_B64=%s\n' "${GABIA_API_KEY_B64}"
            printf 'GABIA_SENDER_NUMBER_B64=%s\n' "${GABIA_SENDER_NUMBER_B64}"
            printf 'SES_REGION_B64=%s\n' "${SES_REGION_B64}"
            printf 'EMAIL_FROM_B64=%s\n' "${EMAIL_FROM_B64}"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          sync_env_from_github_secret() {
            local key="$1"
            local b64_value="$2"
            local decoded_value=""
            local tmp_env

            if [ -n "$b64_value" ]; then
              decoded_value=$(printf '%s' "$b64_value" | base64 -d)
            fi

            tmp_env=$(mktemp)
            awk -v key="${key}=" 'index($0, key) != 1' "${RUNTIME_ENV_FILE}" > "$tmp_env"
            {
              cat "$tmp_env"
              printf '%s=%s\n' "$key" "$decoded_value"
            } > "${RUNTIME_ENV_FILE}"
            rm -f "$tmp_env"
          }

          RUNTIME_DIR="${HOME}/.teameet-prod-runtime"
          RUNTIME_ENV_FILE="${RUNTIME_DIR}/.env"
          mkdir -p "${RUNTIME_DIR}"
          # 최초 1회 부트스트랩: prepare_prod_release_source() 도 같은 일을 하지만, 이
          # 스텝이 그보다 먼저 실행되므로 여기서도 방어적으로 한 번 더 보장한다.
          if [ ! -f "${RUNTIME_ENV_FILE}" ]; then
            # umask 077 로 감싸는 이유: cp 는 새 파일 권한을 umask 로 정한다. EC2 기본 umask 022
            # 에서는 644 로 만들어지고, 아래에서 시크릿 18개를 다 기록한 뒤에야 chmod 600 이
            # 걸린다 — 그 사이 구간 동안 프로덕션 시크릿이 world-readable 로 디스크에 놓인다.
            # 처음부터 600 으로 만들어 그 창 자체를 없앤다(최초 1회 경로라 이후 배포엔 무영향).
            ( umask 077; cp "${HOME}/teameet/deploy/.env" "${RUNTIME_ENV_FILE}" )
          fi

          sync_env_from_github_secret "KAKAO_CLIENT_ID" "${KAKAO_CLIENT_ID_B64:-}"
          sync_env_from_github_secret "KAKAO_CLIENT_SECRET" "${KAKAO_CLIENT_SECRET_B64:-}"
          sync_env_from_github_secret "KAKAO_REDIRECT_URI" "${KAKAO_REDIRECT_URI_B64:-}"
          sync_env_from_github_secret "KAKAO_SCOPE" "${KAKAO_SCOPE_B64:-}"
          sync_env_from_github_secret "V1_HOST_ADMIN_PASSWORD" "${V1_HOST_ADMIN_PASSWORD_B64:-}"
          sync_env_from_github_secret "GA_MEASUREMENT_ID" "${GA_MEASUREMENT_ID_B64:-}"
          sync_env_from_github_secret "VAPID_PUBLIC_KEY" "${VAPID_PUBLIC_KEY_B64:-}"
          sync_env_from_github_secret "VAPID_PRIVATE_KEY" "${VAPID_PRIVATE_KEY_B64:-}"
          sync_env_from_github_secret "VAPID_SUBJECT" "${VAPID_SUBJECT_B64:-}"
          sync_env_from_github_secret "SMS_PROVIDER" "${SMS_PROVIDER_B64:-}"
          sync_env_from_github_secret "SOLAPI_API_KEY" "${SOLAPI_API_KEY_B64:-}"
          sync_env_from_github_secret "SOLAPI_API_SECRET" "${SOLAPI_API_SECRET_B64:-}"
          sync_env_from_github_secret "SOLAPI_SENDER_NUMBER" "${SOLAPI_SENDER_NUMBER_B64:-}"
          sync_env_from_github_secret "GABIA_SMS_ID" "${GABIA_SMS_ID_B64:-}"
          sync_env_from_github_secret "GABIA_API_KEY" "${GABIA_API_KEY_B64:-}"
          sync_env_from_github_secret "GABIA_SENDER_NUMBER" "${GABIA_SENDER_NUMBER_B64:-}"
          sync_env_from_github_secret "SES_REGION" "${SES_REGION_B64:-}"
          sync_env_from_github_secret "EMAIL_FROM" "${EMAIL_FROM_B64:-}"

          # Harden ~/.teameet-prod-runtime/.env perms against EC2 umask 022 — contains
          # DB_PASSWORD/JWT_SECRET and other secrets.
          chmod 600 "${RUNTIME_ENV_FILE}"

          set -a
          . "${RUNTIME_ENV_FILE}"
          set +a

          required_env_vars=(DB_PASSWORD JWT_SECRET)
          for required_env in "${required_env_vars[@]}"; do
            if [ -z "${!required_env:-}" ]; then
              echo "[ERROR] Missing required deploy env: ${required_env}"
              exit 1
            fi
          done

          # ── env 드리프트 경고 ──────────────────────────────────────────────
          # compose 는 ${VAR:-} 형태라 값이 없어도 빈 문자열로 조용히 치환된다. 앱은 그걸
          # "설정 없음"으로 보고 기능을 graceful disable 하므로, 배포는 성공한 채 해당 기능만
          # 죽는다. 위 sync 목록과 compose 참조 목록이 어긋나면 여기서 눈에 띄게 만든다.
          # V1_API_IMAGE/V1_WEB_IMAGE 는 .env 가 아니라 deploy-prod.sh 가 manifest 에서
          # export 하므로 이 검사 대상에서 제외한다(§9 — 매 배포마다 오탐 WARN 을 막는다).
          # grep 은 일치하는 줄이 하나도 없으면 exit 1 이고, 이 블록은 set -euo pipefail 로
          # 돈다 — compose 에서 ${VAR} 참조가 전부 사라지는 정상 상태가 배포를 중단시킨다.
          # #220(프로덕션 배포 교착)과 정확히 같은 계열이라 애초에 그 실패 모드를 없앤다.
          # awk 는 일치가 없어도 0 을 반환한다. 한 줄에 여러 참조가 있을 수 있으므로
          # match 를 반복 적용해 grep -o 와 동일하게 전부 뽑는다.
          drift_keys=$(awk '{
              s = $0
              while (match(s, /\$\{[A-Z0-9_]+/)) {
                print substr(s, RSTART + 2, RLENGTH - 2)
                s = substr(s, RSTART + RLENGTH)
              }
            }' "${HOME}/teameet/deploy/docker-compose.prod.yml" | sort -u)
          empty_keys=""
          for drift_key in ${drift_keys}; do
            case "${drift_key}" in
              V1_API_IMAGE|V1_WEB_IMAGE) continue ;;
            esac
            if [ -z "${!drift_key:-}" ]; then
              empty_keys="${empty_keys} ${drift_key}"
            fi
          done
          if [ -n "${empty_keys}" ]; then
            echo "[WARN] compose 가 참조하지만 런타임 .env 에 값이 없는 키:${empty_keys}"
            echo "[WARN] 의도한 기본값이 아니라면 GitHub secret/variable 등록과 이 워크플로의 sync 목록을 함께 확인할 것."
          fi
          echo "[INFO] Runtime env synced to ${RUNTIME_ENV_FILE}"
          REMOTE_SCRIPT
          } | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ec2 "bash -se"

      # activation(symlink 스왑) + migrate + 컨테이너 교체를 전부 이 한 스텝에서 한다
      # (D3). build-images 가 승인 전에 이미지 push + 소스 스테이징까지 끝내 뒀으므로
      # 여기서 남는 일은 이것뿐이다.
      - name: Run deploy-prod.sh
        timeout-minutes: 20
        env:
          PROD_SHA: ${{ github.sha }}
          PROD_MANIFEST_SHA256: ${{ needs.build-images.outputs.manifestSha256 }}
          PROD_RELEASE_VERSION: ${{ needs.build-images.outputs.releaseVersion }}
          PROD_ECR_REGISTRY: ${{ needs.build-images.outputs.registry }}
          PROD_AWS_REGION: ${{ vars.PROD_AWS_REGION }}
          PROD_SOURCE_SHA256: ${{ needs.build-images.outputs.sourceSha256 }}
        run: |
          set -Eeuo pipefail
          staging="/home/ec2-user/.teameet-prod-staging/${PROD_SHA}"
          ssh ec2 "sudo -u ec2-user -H env \
            PROD_SOURCE_DIR='${staging}' \
            PROD_MANIFEST_FILE='${staging}/deploy/release-manifest.json' \
            PROD_MANIFEST_SHA256='${PROD_MANIFEST_SHA256}' \
            PROD_SHA='${PROD_SHA}' \
            PROD_RELEASE_VERSION='${PROD_RELEASE_VERSION}' \
            PROD_ECR_REGISTRY='${PROD_ECR_REGISTRY}' \
            PROD_AWS_REGION='${PROD_AWS_REGION}' \
            PROD_SOURCE_SHA256='${PROD_SOURCE_SHA256}' \
            bash '${staging}/deploy/deploy-prod.sh'"

      # deploy-prod.sh 는 EC2 안에서 이미 wait_for_prod_health_contract 로 로컬 헬스를
      # 확인한 뒤에만 성공 리턴한다. 여기서는 "EC2 로컬은 성공했지만 네트워크 경로 문제로
      # 퍼블릭엔 아직 안 나온" 케이스를 잡기 위해 러너에서 한 번 더 확인한다(요구사항 5).
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if ssh ec2 'curl -fsS --connect-timeout 5 --max-time 15 http://localhost:8121/api/v1/health | \
                        jq -e ".data.checks.db == true" > /dev/null 2>&1 && \
                        curl -fsS --connect-timeout 5 --max-time 15 --resolve teameet.co.kr:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://teameet.co.kr/landing 2>/dev/null | \
                        grep -qx 200 && \
                        curl -fsS --connect-timeout 5 --max-time 15 --resolve teameet.co.kr:443:127.0.0.1 https://teameet.co.kr/api/v1/health 2>/dev/null | \
                        jq -e ".data.checks.db == true" > /dev/null 2>&1 && \
                        test "$(curl -sS --connect-timeout 5 --max-time 15 --resolve teameet.co.kr:443:127.0.0.1 -o /dev/null -w %{http_code} https://teameet.co.kr/v1/home 2>/dev/null)" = "308"'; then
              echo "Deploy OK"
              exit 0
            fi
            echo "Attempt $i/12 — not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Deploy FAILED"
          exit 1
