# dev 에서 검증된 상태를 main 으로 승격하는 "버튼 하나" 워크플로.
#
# alpha 검증 후, 미소비 changeset 이 있으면 버전 커밋을 release/version-<버전> 브랜치로 push 해
# dev 대상 PR 을 열고 멈춘다(dev 는 PR 필수 ruleset 이라 직접 push 불가). 그 PR 을 머지하고 alpha 가
# 새 dev SHA 를 서빙하면 다시 실행한다 — 그때는 승격 게이트를 검증하고 사람이 누를 dev→main PR 링크를
# job summary 에 남긴다. 실제 로직은 scripts/release/promote-main.sh 에 있다(로컬 테스트 가능).
name: Promote to main

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE to confirm
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 워크플로 트리거로 체크아웃한 것은 dev 뿐이다 — 승격 게이트가 main 과 비교하려면
      # origin/main 도 로컬에 있어야 한다.
      - name: Fetch main
        run: git fetch --no-tags origin main

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Promote dev to main
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/promote-main.sh
