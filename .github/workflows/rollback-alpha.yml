name: Rollback Alpha

on:
  workflow_dispatch:
    inputs:
      expected_active_sha:
        description: Full SHA currently active on alpha
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-alpha
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: alpha
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.ALPHA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.ALPHA_AWS_REGION }}

      - name: Verify alpha AWS target
        id: target
        env:
          ALPHA_AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
          ALPHA_EXPECTED_ACCOUNT_ID: ${{ vars.ALPHA_EXPECTED_ACCOUNT_ID }}
          ALPHA_DEPLOY_BUCKET: ${{ vars.ALPHA_DEPLOY_BUCKET }}
          ALPHA_EC2_INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
        run: bash scripts/release/verify-alpha-aws-target.sh

      - name: Roll back active and previous manifests
        timeout-minutes: 12
        env:
          EXPECTED_ACTIVE_SHA: ${{ inputs.expected_active_sha }}
          INSTANCE_ID: ${{ vars.ALPHA_EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.target.outputs.account_id }}.dkr.ecr.${{ vars.ALPHA_AWS_REGION }}.amazonaws.com
          AWS_REGION: ${{ vars.ALPHA_AWS_REGION }}
        run: bash scripts/release/rollback-alpha-via-ssm.sh
