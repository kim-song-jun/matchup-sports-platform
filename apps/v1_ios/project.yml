# Canonical definition of the Teameet iOS project.
#
# This file plays the role apps/v1_android/app/build.gradle.kts plays on Android.
# Teameet.xcodeproj is a generated artifact and is gitignored: regenerate it with
#
#   scripts/release/generate-ios-version-xcconfig.sh   # writes Config/Version.generated.xcconfig
#   cd apps/v1_ios && xcodegen generate
#
# Keeping the project file out of the tree removes the pbxproj merge conflicts that make
# multi-session work on an Xcode project painful, and leaves one reviewable source of
# truth for build configuration.

name: Teameet

options:
  bundleIdPrefix: kr.co.teameet
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Android models the two environments as product flavors crossed with build types. The
# Xcode equivalent is one build configuration per (environment, optimisation) pair, with
# the environment's xcconfig attached to both of its configurations.
configs:
  Alpha Debug: debug
  Alpha Release: release
  Production Debug: debug
  Production Release: release

configFiles:
  Alpha Debug: Config/Alpha.xcconfig
  Alpha Release: Config/Alpha.xcconfig
  Production Debug: Config/Production.xcconfig
  Production Release: Config/Production.xcconfig

targets:
  Teameet:
    type: application
    platform: iOS
    sources:
      - path: Teameet
    settings:
      base:
        PRODUCT_NAME: Teameet
        # Left off deliberately. INFOPLIST_KEY_<CUSTOM> is a silent no-op for keys Xcode
        # does not already know: -showBuildSettings resolves the setting correctly, but the
        # key never reaches the built Info.plist or Bundle.main.infoDictionary. Measured,
        # not assumed. The explicit `info:` block below is what actually delivers
        # TeameetWebOrigin and friends, via INFOPLIST_EXPAND_BUILD_SETTINGS.
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Teameet/Teameet.entitlements
    info:
      # Generated by XcodeGen from the properties below and gitignored, like the project
      # file itself. It is kept out of Teameet/ so it cannot be swept into the target's
      # own source list.
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: $(TEAMEET_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The environment contract the app reads at runtime through AppConfig.
        TeameetWebOrigin: $(TEAMEET_WEB_ORIGIN)
        TeameetWebViewInspectable: $(TEAMEET_WEBVIEW_INSPECTABLE)

  TeameetTests:
    type: bundle.unit-test
    platform: iOS
    # No `dependencies: [target: Teameet]`, so this bundle runs without a test host and the
    # test *process* never loads UIKit. The scheme still builds the app target
    # for the test action, so a compile error in the WebView or push code fails
    # `xcodebuild test` — the coverage gap a hostless bundle would otherwise leave.
    #
    # Any file listed below must stay free of UIKit and WebKit imports: the test
    # bundle compiles these sources directly instead of importing the app module.
    #
    #
    # Only pure types are listed. Anything importing UIKit, WebKit or Network
    # stays out, which is why the WebShell types are named file by file rather than by
    # directory: the policy, session and bridge pieces are Foundation-only on purpose,
    # while the view controller next to them is not.
    sources:
      - path: TeameetTests
      - path: Teameet/Navigation
      - path: Teameet/Support/AppConfig.swift
      - path: Teameet/WebShell/WebShellFailurePolicy.swift
      - path: Teameet/WebShell/WebShellSession.swift
      - path: Teameet/WebShell/WebShellSessionStore.swift
      - path: Teameet/WebShell/SafeAreaBridge.swift
      - path: Teameet/WebShell/NativeBridgeMessage.swift
      - path: Teameet/WebShell/ChromeColour.swift
      - path: Teameet/WebShell/DownloadPolicy.swift
      - path: Teameet/Push/PushPermission.swift
      - path: Teameet/Push/PushConsent.swift
      - path: Teameet/Push/PushNotificationPayload.swift
      - path: Teameet/Push/PushDeviceRegistration.swift
      - path: Teameet/Push/PushCookieScope.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
    info:
      # Generated and gitignored. The test bundle carries the same environment contract as
      # the app so AppConfigTests can assert on the values its own configuration produced,
      # the way Android's BuildConfigurationTest reads BuildConfig for its flavor.
      # INFOPLIST_KEY_<CUSTOM> cannot do this — see the note on the app target.
      path: TeameetTests-Info.plist
      properties:
        CFBundleDisplayName: $(TEAMEET_DISPLAY_NAME)
        TeameetWebOrigin: $(TEAMEET_WEB_ORIGIN)
        TeameetWebViewInspectable: $(TEAMEET_WEBVIEW_INSPECTABLE)

  TeameetUITests:
    type: bundle.ui-testing
    platform: iOS
    # The live half of the push slice. A notification banner and a system permission alert
    # live in SpringBoard, not in the app, so nothing but a UI test can reach them — and the
    # web's own notification-settings screen is the only place the bridge's answers become
    # visible. Kept in its own scheme so the fast unit run stays offline: these tests talk to
    # the deployed web app and skip themselves without credentials in the environment.
    sources:
      - path: TeameetUITests
    dependencies:
      - target: Teameet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Teameet

schemes:
  TeameetAlpha:
    build:
      targets:
        # The app target IS built for the test action. It is not linked into the test
        # bundle — TeameetTests still has no dependency on it — but building it here means
        # `xcodebuild test` fails on a compile error anywhere in the WebView or push code,
        # which a hostless test bundle would otherwise never notice.
        Teameet: [run, test, profile, analyze, archive]
        TeameetTests: [test]
    run:
      config: Alpha Debug
    test:
      config: Alpha Debug
      targets:
        - TeameetTests
    profile:
      config: Alpha Release
    analyze:
      config: Alpha Debug
    archive:
      config: Alpha Release

  TeameetProduction:
    build:
      targets:
        Teameet: [run, test, profile, analyze, archive]
        TeameetTests: [test]
    run:
      config: Production Debug
    test:
      config: Production Debug
      targets:
        - TeameetTests
    profile:
      config: Production Release
    analyze:
      config: Production Debug
    archive:
      config: Production Release

  TeameetAlphaUITests:
    build:
      targets:
        Teameet: [run, test, profile, analyze, archive]
        TeameetUITests: [test]
    run:
      config: Alpha Debug
    test:
      config: Alpha Debug
      targets:
        - TeameetUITests
      # The account these tests sign in with never lands in the repository. The scheme only
      # names the variables; their values are build settings supplied on the xcodebuild
      # command line by scripts/ios/verify-push-slice.sh, which reads them from its own
      # environment.
      environmentVariables:
        TEAMEET_UITEST_EMAIL: $(TEAMEET_UITEST_EMAIL)
        TEAMEET_UITEST_PASSWORD: $(TEAMEET_UITEST_PASSWORD)
        TEAMEET_UITEST_INQUIRY_ID: $(TEAMEET_UITEST_INQUIRY_ID)
        TEAMEET_UITEST_INQUIRY_TITLE: $(TEAMEET_UITEST_INQUIRY_TITLE)
        TEAMEET_UITEST_EXPECT_SUBSCRIBED: $(TEAMEET_UITEST_EXPECT_SUBSCRIBED)
