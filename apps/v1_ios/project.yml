# Canonical definition of the Teameet iOS project.
#
# This file plays the role apps/v1_android/app/build.gradle.kts plays on Android.
# Teameet.xcodeproj is a generated artifact and is gitignored: regenerate it with
#
#   scripts/release/generate-ios-version-xcconfig.sh   # writes Config/Version.generated.xcconfig
#   cd apps/v1_ios && xcodegen generate
#
# Keeping the project file out of the tree removes the pbxproj merge conflicts that make
# multi-session work on an Xcode project painful, and leaves one reviewable source of
# truth for build configuration.

name: Teameet

options:
  bundleIdPrefix: kr.co.teameet
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Android models the two environments as product flavors crossed with build types. The
# Xcode equivalent is one build configuration per (environment, optimisation) pair, with
# the environment's xcconfig attached to both of its configurations.
configs:
  Alpha Debug: debug
  Alpha Release: release
  Production Debug: debug
  Production Release: release

configFiles:
  Alpha Debug: Config/Alpha.xcconfig
  Alpha Release: Config/Alpha.xcconfig
  Production Debug: Config/Production.xcconfig
  Production Release: Config/Production.xcconfig

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    # Pinned exactly, mirroring Android's `platform("com.google.firebase:firebase-bom:34.18.0")`.
    # A floating range would let CI and a developer's machine build different SDKs.
    # 12.18.0 declares a minimum of iOS 15.0, below this project's 16.0 target.
    exactVersion: 12.18.0

targets:
  Teameet:
    type: application
    platform: iOS
    sources:
      - path: Teameet
    dependencies:
      # FirebaseMessaging depends on FirebaseCore internally, but Firebase's SPM
      # integration expects both library products to be linked explicitly.
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_NAME: Teameet
        # Left off deliberately. INFOPLIST_KEY_<CUSTOM> is a silent no-op for keys Xcode
        # does not already know: -showBuildSettings resolves the setting correctly, but the
        # key never reaches the built Info.plist or Bundle.main.infoDictionary. Measured,
        # not assumed. The explicit `info:` block below is what actually delivers
        # TeameetWebOrigin and friends, via INFOPLIST_EXPAND_BUILD_SETTINGS.
        GENERATE_INFOPLIST_FILE: NO
    info:
      # Generated by XcodeGen from the properties below and gitignored, like the project
      # file itself. It is kept out of Teameet/ so it cannot be swept into the target's
      # own source list.
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: $(TEAMEET_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The environment contract the app reads at runtime through AppConfig.
        TeameetWebOrigin: $(TEAMEET_WEB_ORIGIN)
        TeameetWebViewInspectable: $(TEAMEET_WEBVIEW_INSPECTABLE)
        TeameetFirebaseProjectId: $(TEAMEET_FIREBASE_PROJECT_ID)
        TeameetFirebaseAppId: $(TEAMEET_FIREBASE_APP_ID)
        TeameetFirebaseApiKey: $(TEAMEET_FIREBASE_API_KEY)
        TeameetFirebaseSenderId: $(TEAMEET_FIREBASE_SENDER_ID)

  TeameetTests:
    type: bundle.unit-test
    platform: iOS
    # No `dependencies: [target: Teameet]`, so this bundle runs without a test host and the
    # test *process* never loads Firebase or UIKit. The scheme still builds the app target
    # for the test action, so a compile error in the WebView or push code fails
    # `xcodebuild test` — the coverage gap a hostless bundle would otherwise leave.
    #
    # Any file listed below must stay free of UIKit, WebKit and Firebase imports: the test
    # bundle compiles these sources directly instead of importing the app module.
    #
    # Note that no arrangement makes the test action offline. xcodebuild resolves the
    # project's package graph, and SwiftPM fetches firebase-ios-sdk's binary artifacts for
    # the whole package rather than only the linked products — about 850MB, of which
    # grpc-binary alone is 609MB (measured). CI caches SourcePackages for this reason; see
    # .github/workflows/ios-alpha.yml.
    sources:
      - path: TeameetTests
      - path: Teameet/Navigation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Mirrors the app's environment contract so a test can assert on the values its
        # own configuration produced, the way Android's BuildConfigurationTest reads
        # BuildConfig for the flavor it was compiled into.
        INFOPLIST_KEY_CFBundleDisplayName: $(TEAMEET_DISPLAY_NAME)

schemes:
  TeameetAlpha:
    build:
      targets:
        # The app target IS built for the test action. It is not linked into the test
        # bundle — TeameetTests still has no dependency on it — but building it here means
        # `xcodebuild test` fails on a compile error anywhere in the WebView or push code,
        # which a hostless test bundle would otherwise never notice.
        Teameet: [run, test, profile, analyze, archive]
        TeameetTests: [test]
    run:
      config: Alpha Debug
    test:
      config: Alpha Debug
      targets:
        - TeameetTests
    profile:
      config: Alpha Release
    analyze:
      config: Alpha Debug
    archive:
      config: Alpha Release

  TeameetProduction:
    build:
      targets:
        Teameet: [run, test, profile, analyze, archive]
        TeameetTests: [test]
    run:
      config: Production Debug
    test:
      config: Production Debug
      targets:
        - TeameetTests
    profile:
      config: Production Release
    analyze:
      config: Production Debug
    archive:
      config: Production Release
