# Cloudflare 엣지 IP 대역 — nginx 가 신뢰할 프록시 목록.
#
# 생성물이다. 직접 편집하지 말고 scripts/ops/sync-cloudflare-ips.sh 로 재생성한다.
#   출처: https://api.cloudflare.com/client/v4/ips
#   etag: 38f79d050aa027e3be3865e495dcc9bc
#   수집: 2026-08-01
#
# 왜 필요한가 —
# Cloudflare 프록시를 켜면 ALB 가 보는 접속자는 실사용자가 아니라 Cloudflare 엣지다.
# 그래서 nginx 에 도착하는 X-Forwarded-For 는 이렇게 된다:
#
#     <실사용자>, <Cloudflare 엣지>            (ALB 가 자기가 본 주소를 끝에 덧붙임)
#
# 기존 설정(real_ip_recursive off)은 XFF 의 **마지막** 값을 실주소로 삼으므로, 이 상태
# 에서는 접속자 전원이 Cloudflare 엣지 IP 하나로 뭉뚱그려진다 → limit_req 가 다시
# 전원 합산으로 붕괴한다. 2026-07-25 에 ALB 도입으로 똑같은 사고를 이미 한 번 겪었다
# (nginx.alpha.conf 상단 주석 참조).
#
# 이 목록을 set_real_ip_from 에 넣고 real_ip_recursive on 을 켜면 nginx 가 XFF 를
# 오른쪽부터 훑으며 신뢰 대역을 건너뛰고 첫 비신뢰 주소 = 실사용자에서 멈춘다.
#
# 스푸핑이 성립하지 않는 이유 —
# 클라이언트가 XFF 를 위조해도 Cloudflare 가 실주소를 그 **뒤에** 덧붙이므로 위조값은
# 항상 실주소보다 왼쪽에 남는다. 오른쪽부터 훑는 탐색은 위조값에 닿기 전에 실주소에서
# 멈춘다.
#
#     위조: "1.2.3.4"  →  CF: "1.2.3.4, <실사용자>"  →  ALB: "1.2.3.4, <실사용자>, <엣지>"
#                                                                   ^^^^^^^^^^^ 여기서 멈춤
#
# 알려진 한계: 실사용자가 Cloudflare 대역에서 접속하는 경우(예: Cloudflare Workers 를
# 경유한 서버간 호출)에는 그 주소도 신뢰 대역이라 건너뛰어 그 왼쪽 값을 집는다. 사람
# 트래픽에는 해당하지 않으므로 감수한다.

