services:
  v1_uploads_init:
    image: ${ALPHA_API_IMAGE:?ALPHA_API_IMAGE must be an ECR digest URI}

  v1_api:
    image: ${ALPHA_API_IMAGE:?ALPHA_API_IMAGE must be an ECR digest URI}
    environment:
      V1_RELEASE: ${ALPHA_RELEASE_VERSION:-}
      # 관리자 화면에서 PUBLIC_LIVE/DIRECTOR_OFFICIALIZE 를 immutable 게이트 번들(R1/R2,
      # 14일 이상) 없이 CAS+감사 로그만으로 켜고 끌 수 있게 하는 admin 전용 우회 경로.
      # apps/v1_api/src/config/game-operation-flags.ts의 isSimplifiedOperationFlagGateEnabled()
      # 참고 -- NODE_ENV=production 은 alpha/실프로덕션 공용이라 구분 신호가 못 되므로 이 변수
      # 하나만이 유일한 환경 판정 신호다. docker-compose.prod.yml 에는 절대 추가하지 않는다.
      V1_ALLOW_SIMPLIFIED_OPERATION_FLAG_GATE: "true"

  # 워커는 전용 이미지를 빌드하지 않고 API 이미지를 그대로 재사용한다
  # (alpha-release-common.sh 의 assert_running_release_digests 가
  #  running_worker_image == ALPHA_API_IMAGE 를 단언한다). 따라서 entrypoint 는
  #  API 이미지의 레이아웃(dist/src/...)을 따라야 한다 — Dockerfile.v1-api 의
  #  CMD ["node", "dist/src/main.js"] 와 같은 규칙이다.
  v1_game_operations_worker:
    image: ${ALPHA_API_IMAGE:?ALPHA_API_IMAGE must be an ECR digest URI}
    command: ["node", "dist/src/jobs/v1-game-operations-worker.main.js"]
    restart: always
    environment:
      DATABASE_URL: postgresql://${V1_DB_USER:-teameet_v1}:${V1_DB_PASSWORD:-${DB_PASSWORD}}@v1_postgres:5432/${V1_DB_NAME:-teameet_v1}
      NODE_ENV: production
      WORKER_PORT: ${WORKER_PORT:-8122}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${WORKER_PORT:-8122}/api/v1/game-operations-worker/health').then((res) => { if (!res.ok) throw new Error('game operations worker health ' + res.status); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      v1_postgres:
        condition: service_healthy

  v1_web:
    image: ${ALPHA_WEB_IMAGE:?ALPHA_WEB_IMAGE must be an ECR digest URI}

  nginx:
    volumes:
      - ./nginx.alpha.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.security-headers.conf:/etc/nginx/snippets/teameet-security-headers.conf:ro
      - ./nginx.proxy-hide-security-headers.conf:/etc/nginx/snippets/teameet-proxy-hide-security-headers.conf:ro
      - ./release-metadata.alpha.conf:/etc/nginx/snippets/teameet-release-metadata.conf:ro
