# 구(legacy) 루트 스택(postgres/redis/api/web)은 2026-07 아카이빙됨.
# 구 스택 데이터 볼륨(postgres_data, uploads_data)은 도커 호스트에 그대로 남아 있다
# (compose 정의에서 제외했으므로 `down -v`로도 삭제되지 않음 — 복구 시 수동 재연결).
services:
  v1_postgres:
    image: postgres:16-alpine
    container_name: teameet_v1_postgres
    restart: always
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c max_connections=100
      -c work_mem=4MB
    environment:
      POSTGRES_USER: ${V1_DB_USER:-teameet_v1}
      POSTGRES_PASSWORD: ${V1_DB_PASSWORD:-${DB_PASSWORD}}
      POSTGRES_DB: ${V1_DB_NAME:-teameet_v1}
    volumes:
      - v1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${V1_DB_USER:-teameet_v1} -d ${V1_DB_NAME:-teameet_v1}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  v1_uploads_init:
    image: ${V1_API_IMAGE}
    user: 0:0
    restart: no
    volumes:
      - v1_uploads_data:/app/apps/v1_api/uploads
    entrypoint: [sh, -c]
    command:
      - >-
        set -eu;
        mkdir -p /app/apps/v1_api/uploads;
        chown -R 1001:1001 /app/apps/v1_api/uploads

  v1_api:
    image: ${V1_API_IMAGE}
    container_name: teameet_v1_api
    restart: always
    volumes:
      - v1_uploads_data:/app/apps/v1_api/uploads
    environment:
      # DB 접속 대상을 변수로 뺀다 — 기본값이 v1_postgres 라 미설정 시 지금과 완전히 동일하게
      # 동작한다(alpha 도 이 파일을 베이스로 로드하므로 기본값 유지가 필수다).
      #
      # 비밀번호를 V1_DB_APP_PASSWORD 로 따로 둔 이유: V1_DB_PASSWORD 는 바로 위
      # v1_postgres 컨테이너의 POSTGRES_PASSWORD 로도 쓰인다. RDS 로 옮기면서 그 값을
      # RDS 비밀번호로 바꾸면, 데이터 디렉터리가 이미 초기화된 로컬 컨테이너는 옛 비밀번호를
      # 유지한 채 접속 문자열만 바뀌어 인증에 실패한다(2026-08-03 실제로 이 상태를 만들 뻔했다).
      # 앱이 무엇으로 접속하는지와 로컬 컨테이너가 무엇으로 초기화됐는지는 별개 값이어야 한다.
      DATABASE_URL: postgresql://${V1_DB_USER:-teameet_v1}:${V1_DB_APP_PASSWORD:-${V1_DB_PASSWORD:-${DB_PASSWORD}}}@${V1_DB_HOST:-v1_postgres}:5432/${V1_DB_NAME:-teameet_v1}
      JWT_SECRET: ${V1_JWT_SECRET:-${JWT_SECRET}}
      V1_SESSION_SECRET: ${V1_SESSION_SECRET:-${V1_JWT_SECRET:-${JWT_SECRET}}}
      FRONTEND_URL: ${FRONTEND_URL:-https://teameet.co.kr}
      V1_HOST_ADMIN_PASSWORD: ${V1_HOST_ADMIN_PASSWORD:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-solapi}
      GABIA_SMS_ID: ${GABIA_SMS_ID:-}
      GABIA_API_KEY: ${GABIA_API_KEY:-}
      GABIA_SENDER_NUMBER: ${GABIA_SENDER_NUMBER:-}
      # SES 이메일 발송. 자격증명은 인스턴스 IAM 역할에 맡기고 리전/발신주소만 준다.
      # 둘 중 하나라도 비면 EmailSender.enabled=false → 기존 로그 스텁 그대로다.
      SES_REGION: ${SES_REGION:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      API_PORT: 8121
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      V1_PUSH_ENVIRONMENT: ${V1_PUSH_ENVIRONMENT:-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8121/api/v1/health').then(async (res) => { if (!res.ok) throw new Error('v1 api health ' + res.status); const json = await res.json(); if (!json?.data?.checks?.db) throw new Error('v1 api health degraded'); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      v1_postgres:
        condition: service_healthy
      v1_uploads_init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8121:8121"
    deploy:
      resources:
        limits:
          memory: 512M

  v1_game_operations_worker:
    image: ${V1_API_IMAGE}
    container_name: teameet_v1_game_operations_worker
    command: ["node", "dist/src/jobs/v1-game-operations-worker.main.js"]
    restart: always
    environment:
      DATABASE_URL: postgresql://${V1_DB_USER:-teameet_v1}:${V1_DB_APP_PASSWORD:-${V1_DB_PASSWORD:-${DB_PASSWORD}}}@${V1_DB_HOST:-v1_postgres}:5432/${V1_DB_NAME:-teameet_v1}
      NODE_ENV: production
      WORKER_PORT: ${WORKER_PORT:-8122}
      FRONTEND_URL: ${FRONTEND_URL:-https://teameet.co.kr}
      SLACK_INQUIRY_WEBHOOK_URL: ${SLACK_INQUIRY_WEBHOOK_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      V1_PUSH_ENVIRONMENT: ${V1_PUSH_ENVIRONMENT:-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${WORKER_PORT:-8122}/api/v1/game-operations-worker/health').then(async (res) => { const json = await res.json(); const status = json?.data?.deploymentStatus ?? json?.deploymentStatus; if (!res.ok || status !== 'healthy') throw new Error('game operations worker health ' + res.status + ' deploymentStatus=' + status); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      v1_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  v1_web:
    image: ${V1_WEB_IMAGE}
    container_name: teameet_v1_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      NEXT_PUBLIC_KAKAO_SCOPE: ${KAKAO_SCOPE:-}
      INTERNAL_API_ORIGIN: ${V1_INTERNAL_API_ORIGIN:-http://v1_api:8121}
      HOSTNAME: 0.0.0.0
      PORT: 3013
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      v1_api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3013/landing').then((res) => { if (!res.ok) throw new Error('v1 web health ' + res.status); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:3013:3013"
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: teameet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./release-metadata.prod.conf:/etc/nginx/snippets/teameet-release-metadata.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      v1_web:
        condition: service_healthy
      v1_api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  v1_postgres_data:
  v1_uploads_data:
