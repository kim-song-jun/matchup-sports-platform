# 구(legacy) 루트 스택(postgres/redis/api/web)은 2026-07 아카이빙됨.
# 구 스택 데이터 볼륨(postgres_data, uploads_data)은 도커 호스트에 그대로 남아 있다
# (compose 정의에서 제외했으므로 `down -v`로도 삭제되지 않음 — 복구 시 수동 재연결).
# v1_web 과 v1_web_b 가 같은 설정을 쓴다. 컨테이너 이름·볼륨·포트만 서비스마다 다르다.
x-v1-web: &v1-web
  image: ${V1_WEB_IMAGE}
  restart: always
  # Next 는 종료 신호를 받으면 새 연결을 막고 진행 중 요청을 끝낸 뒤 나간다. 이 값은 그 기다림의 상한이다.
  # 다시 쓰이는 keep-alive 연결은 이미지의 deploy/runtime/http-drain-on-shutdown.cjs 가 닫으므로 처리 중 요청만 기다린다. 기본 10초는 느린 서버 렌더를 자른다.
  stop_grace_period: 30s
  environment:
    NEXT_PUBLIC_API_URL: /api/v1
    NEXT_PUBLIC_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
    NEXT_PUBLIC_KAKAO_LOGIN_JS_KEY: ${KAKAO_LOGIN_JS_KEY:-}
    NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
    NEXT_PUBLIC_KAKAO_SCOPE: ${KAKAO_SCOPE:-}
    ANDROID_APP_LINKS_SHA256_CERT_FINGERPRINTS: ${ANDROID_APP_LINKS_SHA256_CERT_FINGERPRINTS:-}
    INTERNAL_API_ORIGIN: ${V1_INTERNAL_API_ORIGIN:-http://v1_api:8121}
    HOSTNAME: 0.0.0.0
    PORT: 3013
    NODE_ENV: production
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  depends_on:
    v1_api:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3013/landing').then((res) => { if (!res.ok) throw new Error('v1 web health ' + res.status); }).catch(() => process.exit(1));",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  # 운영 DB 는 RDS 라 이 파일에는 DB 컨테이너가 없다. alpha 의 DB 컨테이너(v1_postgres)는 docker-compose.alpha.yml 에 있다.
  v1_uploads_init:
    image: ${V1_API_IMAGE}
    user: 0:0
    restart: no
    volumes:
      - v1_uploads_data:/app/apps/v1_api/uploads
    entrypoint: [sh, -c]
    command:
      - >-
        set -eu;
        mkdir -p /app/apps/v1_api/uploads;
        chown -R 1001:1001 /app/apps/v1_api/uploads

  v1_api:
    image: ${V1_API_IMAGE}
    container_name: teameet_v1_api
    restart: always
    # 관리자 대진 트랜잭션이 45초까지 가므로 Docker 기본 10초면 재생성마다 끊긴다. 하한은 qa:compose-stop-grace 가 지킨다.
    stop_grace_period: 60s
    volumes:
      - v1_uploads_data:/app/apps/v1_api/uploads
    environment:
      # 호스트는 런타임 .env 의 V1_DB_HOST(RDS)이고 대신 쓸 기본값은 없다. 비어 있으면 deploy-prod.sh 가
      # 컨테이너를 건드리기 전에 멈춘다. alpha 는 오버레이가 이 값을 같은 호스트의 v1_postgres 로 다시 정한다.
      # (`:?` 를 쓰지 않는 이유: compose 는 파일마다 따로 보간해서 오버레이가 덮어써도 alpha 가 실패한다.)
      #
      # 앱 접속 비밀번호는 V1_DB_APP_PASSWORD 로 따로 받는다 — V1_DB_PASSWORD 는 alpha DB 컨테이너가
      # 처음 초기화될 때의 비밀번호라, 둘을 한 값으로 묶으면 바꾸는 순간 이미 초기화된 쪽 인증이 깨진다.
      DATABASE_URL: postgresql://${V1_DB_USER:-teameet_v1}:${V1_DB_APP_PASSWORD:-${V1_DB_PASSWORD:-${DB_PASSWORD}}}@${V1_DB_HOST:-}:5432/${V1_DB_NAME:-teameet_v1}
      JWT_SECRET: ${V1_JWT_SECRET:-${JWT_SECRET}}
      V1_SESSION_SECRET: ${V1_SESSION_SECRET:-${V1_JWT_SECRET:-${JWT_SECRET}}}
      FRONTEND_URL: ${FRONTEND_URL:-https://teameet.co.kr}
      V1_HOST_ADMIN_PASSWORD: ${V1_HOST_ADMIN_PASSWORD:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-solapi}
      GABIA_SMS_ID: ${GABIA_SMS_ID:-}
      GABIA_API_KEY: ${GABIA_API_KEY:-}
      GABIA_SENDER_NUMBER: ${GABIA_SENDER_NUMBER:-}
      # SES 이메일 발송. 자격증명은 인스턴스 IAM 역할에 맡기고 리전/발신주소만 준다.
      # 둘 중 하나라도 비면 실제 이메일 인증 요청은 설정 오류를 반환한다.
      SES_REGION: ${SES_REGION:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      API_PORT: 8121
      V1_FLEXIBLE_BRACKETS_ENABLED: ${V1_FLEXIBLE_BRACKETS_ENABLED:-false}
      V1_FLEXIBLE_BRACKET_TOURNAMENT_IDS: ${V1_FLEXIBLE_BRACKET_TOURNAMENT_IDS:-}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      V1_PUSH_ENVIRONMENT: ${V1_PUSH_ENVIRONMENT:-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # Sign in with Apple 이 받아들일 audience(= 번들 id). 비밀이 아니라 앱 스토어에 찍히는
      # 값이라 시크릿 동기화 없이 리터럴로 둔다. 비어 있으면(또는 V1_SESSION_SECRET 이 32자
      # 미만이면) /auth/apple 과 /auth/apple/nonce 가 503 APPLE_SIGN_IN_NOT_CONFIGURED 로
      # 답한다 — 나머지 로그인 경로는 영향받지 않는다.
      APPLE_SIGN_IN_AUDIENCES: ${APPLE_SIGN_IN_AUDIENCES:-kr.co.teameet}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APPLE_SIGN_IN_KEY_ID: ${APPLE_SIGN_IN_KEY_ID:-}
      APPLE_SIGN_IN_TEAM_ID: ${APPLE_SIGN_IN_TEAM_ID:-}
      APPLE_SIGN_IN_PRIVATE_KEY: ${APPLE_SIGN_IN_PRIVATE_KEY:-}
      APPLE_SIGN_IN_TOKEN_ENCRYPTION_KEY: ${APPLE_SIGN_IN_TOKEN_ENCRYPTION_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8121/api/v1/health').then(async (res) => { if (!res.ok) throw new Error('v1 api health ' + res.status); const json = await res.json(); if (!json?.data?.checks?.db) throw new Error('v1 api health degraded'); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # DB 컨테이너를 쓰는 alpha 는 오버레이가 v1_postgres 의존을 더한다.
    depends_on:
      v1_uploads_init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8121:8121"
    deploy:
      resources:
        limits:
          memory: 512M

  v1_game_operations_worker:
    image: ${V1_API_IMAGE}
    container_name: teameet_v1_game_operations_worker
    command: ["node", "dist/src/jobs/v1-game-operations-worker.main.js"]
    restart: always
    # 워커는 진행 중 일감을 20초까지 기다린 뒤 임대를 풀어서, 기본 10초면 풀기 전에 SIGKILL 을 받는다.
    stop_grace_period: 30s
    environment:
      # v1_api 와 같은 규칙(위 주석).
      DATABASE_URL: postgresql://${V1_DB_USER:-teameet_v1}:${V1_DB_APP_PASSWORD:-${V1_DB_PASSWORD:-${DB_PASSWORD}}}@${V1_DB_HOST:-}:5432/${V1_DB_NAME:-teameet_v1}
      NODE_ENV: production
      WORKER_PORT: ${WORKER_PORT:-8122}
      FRONTEND_URL: ${FRONTEND_URL:-https://teameet.co.kr}
      SLACK_INQUIRY_WEBHOOK_URL: ${SLACK_INQUIRY_WEBHOOK_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      V1_PUSH_ENVIRONMENT: ${V1_PUSH_ENVIRONMENT:-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # Sign in with Apple 이 받아들일 audience(= 번들 id). 비밀이 아니라 앱 스토어에 찍히는
      # 값이라 시크릿 동기화 없이 리터럴로 둔다. 비어 있으면(또는 V1_SESSION_SECRET 이 32자
      # 미만이면) /auth/apple 과 /auth/apple/nonce 가 503 APPLE_SIGN_IN_NOT_CONFIGURED 로
      # 답한다 — 나머지 로그인 경로는 영향받지 않는다.
      APPLE_SIGN_IN_AUDIENCES: ${APPLE_SIGN_IN_AUDIENCES:-kr.co.teameet}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APPLE_SIGN_IN_KEY_ID: ${APPLE_SIGN_IN_KEY_ID:-}
      APPLE_SIGN_IN_TEAM_ID: ${APPLE_SIGN_IN_TEAM_ID:-}
      APPLE_SIGN_IN_PRIVATE_KEY: ${APPLE_SIGN_IN_PRIVATE_KEY:-}
      APPLE_SIGN_IN_TOKEN_ENCRYPTION_KEY: ${APPLE_SIGN_IN_TOKEN_ENCRYPTION_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${WORKER_PORT:-8122}/api/v1/game-operations-worker/health').then(async (res) => { const json = await res.json(); const status = json?.data?.deploymentStatus ?? json?.deploymentStatus; if (!res.ok || status !== 'healthy') throw new Error('game operations worker health ' + res.status + ' deploymentStatus=' + status); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  v1_web:
    <<: *v1-web
    container_name: teameet_v1_web
    # /_next/image 변환 결과를 배포 사이에 유지한다 — 없으면 배포마다 모든 사진을 다시 변환한다.
    # 이미지 안에 app 소유로 만들어 둔 폴더라 첫 연결 때 그 소유권을 물려받는다(Dockerfile.v1-web).
    # 상한은 next.config.ts 의 images.maximumDiskCacheSize. .next/cache 전체가 아니라 images 만 —
    # 다른 캐시는 빌드마다 달라 남기면 안 된다.
    volumes:
      - v1_web_image_cache:/app/apps/v1_web/.next/cache/images
    ports:
      - "127.0.0.1:3013:3013"
    # NODE_OPTIONS 를 두지 않아 Node 가 이 한도의 약 절반을 JS heap 상한으로 잡는다(512M → 259MB, 768M → 396MB).
    # 한도를 낮추면 heap 상한도 같이 내려간다. alpha 오버레이도 이 값을 그대로 쓴다.
    deploy:
      resources:
        limits:
          memory: 768M

  # 두 번째 웹 컨테이너 — V1_WEB_REPLICAS=2 일 때만 뜬다(배포 스크립트가 `--profile web-pair` 를 건다).
  # 4GB 이상 호스트에서 쓴다: 한쪽이 죽거나 배포로 다시 만들어지는 동안 다른 쪽이 받는다.
  # 이미지 캐시 볼륨은 컨테이너마다 따로 둔다 — Next 이미지 최적화기는 캐시 파일을 잠금 없이 쓰므로
  # 두 프로세스가 한 폴더를 같이 쓰면 덜 쓴 파일을 읽을 수 있다. 호스트 포트는 열지 않는다.
  v1_web_b:
    <<: *v1-web
    container_name: teameet_v1_web_b
    profiles: ["web-pair"]
    volumes:
      - v1_web_b_image_cache:/app/apps/v1_web/.next/cache/images
    # v1_web 과 같은 한도(위 주석 참조). 한도 하한 검사가 서비스 블록 안의 값을 읽으므로 공통 설정에 넣지 않는다.
    deploy:
      resources:
        limits:
          memory: 768M

  nginx:
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    container_name: teameet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx-live 는 릴리스마다 바뀌지 않는 런타임 폴더를 가리킨다. 배포가 안의 파일을 바꾸고 reload 하므로
      # 배포마다 nginx 를 다시 만들지 않는다(deploy/web-replicas-common.sh 의 sync_nginx_live_config).
      # 무엇을 어디에 두는지는 prod-release-common.sh 의 sync_prod_nginx_config 가 정한다(웹 개수에 맞는 nginx-web/<개수> 포함).
      # :ro 가 없으면 이미지 entrypoint(10-listen-on-ipv6-by-default.sh)가 시작할 때 default.conf 를 고친다.
      - ./nginx-live/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-live/aasa:/etc/nginx/teameet-aasa:ro
      - ./nginx-live/maintenance:/etc/nginx/teameet-maintenance:ro
      # 점검 플래그 디렉터리는 릴리스 디렉터리(배포마다 교체) 밖에 둬야 배포가 플래그를 지우지 않는다.
      - /home/ec2-user/.teameet-maintenance:/etc/nginx/maintenance:ro
      - ./nginx-live/snippets:/etc/nginx/snippets:ro
      - ./nginx-live/web:/etc/nginx/teameet-web:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      v1_web:
        condition: service_healthy
      v1_api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  v1_uploads_data:
  v1_web_image_cache:
  v1_web_b_image_cache:
