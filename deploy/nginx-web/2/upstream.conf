# 웹 컨테이너 2개 — 한쪽이 죽었거나 재시작 중이면 failover.conf 의 재시도가 다른 쪽으로 넘긴다.
# 이름은 시작·reload 때 한 번 해석하므로 컨테이너를 다시 만든 뒤에는 배포 스크립트가 nginx 를
# reload 한다(deploy/web-replicas-common.sh 의 roll_web_services).
upstream v1_web {
    server v1_web:3013 max_fails=2 fail_timeout=5s;
    server v1_web_b:3013 max_fails=2 fail_timeout=5s;
}
