server_tokens off;

upstream v1_web {
    server v1_web:3013;
}

upstream v1_api {
    server v1_api:8121;
}

# uploads zone: 이미 저장된 이미지를 보여주는 GET /uploads/* 전용(정적 파일 서빙, 업로드
# 생성 POST /api/v1/uploads는 인증 필요 + 아래 v1api zone을 탄다 — 별개).
# 팀/대회/장터 등 목록·갤러리 화면은 한 번에 수십 장의 썸네일을 동시에 요청하므로
# API 호출(v1api)보다 여유 있게 잡는다. 기존 rate=10r/m·burst=5는 팀 목록(최대 20개
# 로고)조차 못 버텨 6번째 이미지부터 즉시 503 — 목록에서 예산을 다 쓰면 곧이어 연 상세
# 페이지의 이미지도 같은 1분 창 안에서 rate limit에 걸렸다.
# alpha는 ALB 뒤에 있어서 $remote_addr가 실사용자가 아니라 ALB 노드 IP(172.31.x.x)다.
# 이 교정이 없으면 아래 limit_req가 접속자 전원을 ALB 노드 수(3개)만큼의 버킷에 합산해,
# 한 사람이 화면 몇 개만 열어도 무관한 다른 사용자까지 함께 503을 맞는다 — 2026-07-25
# /my 진입·카카오 로그인이 "오류 + 인증 풀림"으로 보이던 실제 원인이다(nginx error.log
# `limiting requests ... by zone "v1api"` 33건, client가 전부 ALB IP로 기록됨).
# real_ip_recursive는 기본값(off)을 유지한다 — ALB가 X-Forwarded-For 끝에 실제 접속
# IP를 덧붙이므로 마지막 값이 곧 신뢰할 수 있는 주소이고, 클라이언트가 XFF를 위조해도
# 그 뒤에 실주소가 붙어 스푸핑이 성립하지 않는다.
set_real_ip_from 172.31.0.0/16;
real_ip_header X-Forwarded-For;

# 한도는 "화면 1개가 부르는 API 수" 기준으로 잡는다. /my 한 화면이 me/profile·me/teams·
# activity-summary·notifications·pending-reviews 등을 동시에 부르고 목록 화면은 항목마다
# 상세를 조회하므로, 정상 사용 1인의 실측치가 이미 분당 99요청이었다(기존 한도 60r/m).
limit_req_zone $binary_remote_addr zone=uploads:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=v1api:10m rate=300r/m;
# 세션 확인(GET /auth/me)은 화면을 옮길 때마다 발생하는 무해한 읽기라서 로그인 시도와
# 같은 예산을 쓰면 안 된다. 아래 v1auth와 분리해 넉넉하게 준다 — 기존에는 한 zone을
# 공유해 화면을 6번만 넘겨도 /auth/me가 503이 됐고, 프론트는 그걸 "로그인 상태 확인
# 실패"로 표시해 세션이 멀쩡한데도 인증이 풀린 것처럼 보였다.
limit_req_zone $binary_remote_addr zone=v1session:10m rate=120r/m;
# 로그인·회원가입·소셜 인증은 브루트포스 대상이라 계속 좁게 유지한다. 다만 소셜 가입은
# kakao → social-profile → social-terms로 연달아 호출되므로 burst로 그 흐름만 흡수한다.
limit_req_zone $binary_remote_addr zone=v1auth:10m rate=30r/m;

server {
    listen 80;
    server_name alpha.teameet.co.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://alpha.teameet.co.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name alpha.teameet.co.kr;

    ssl_certificate /etc/letsencrypt/live/alpha.teameet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.teameet.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:alpha_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 55m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Universal Links. Apple fetches this over https, follows no redirects, and wants JSON
    # from a path with no extension. Serving it lets a /callback/* link open the iOS app so
    # the Kakao sign-in redirect finishes where the session belongs instead of in Safari.
    #
    # The file does not exist until the Apple Team ID does — see deploy/aasa/README.md — and
    # nginx answers 404 until then, which is what it answers today.
    location = /.well-known/apple-app-site-association {
        alias /etc/nginx/teameet-aasa/apple-app-site-association;
        default_type application/json;
        # No `always`: that would attach the header to the 404 this returns until the
        # association file exists, and an hour-long cached 404 is exactly what delays
        # Universal Links from turning on once the file is finally added.
        add_header Cache-Control "public, max-age=3600";
    }

    # 세션 확인 전용. exact match(=)라 아래 ^~ /api/v1/auth/ 블록보다 우선한다.
    # 로그인 시도와 예산을 분리하려는 것이 유일한 목적이므로 나머지 설정은 아래와 동일하다.
    location = /api/v1/auth/me {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1session burst=30 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/auth/ {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1auth burst=10 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # v1 인증은 x-v1-user-id/x-v1-user-email 헤더 신뢰 방식이다(서명 세션 아님, 의도적 dev/alpha 전용
        # 위험 수용 — apps/v1_api/src/main.ts의 V1_ALLOW_HEADER_AUTH fail-closed 게이트로 프로덕션 부팅 시
        # 명시 opt-in 필요). 여기서 헤더를 비우면 GET /auth/me 를 포함해 이 prefix의 모든 인증 요청이
        # 항상 401이 된다 — 스푸핑 방지 의도였다면 게이트가 이미 그 리스크를 감수하기로 결정한 뒤이므로
        # 이 위치에서 다시 막는 건 알파를 통째로 인증 불능으로 만들 뿐 추가 보안 이득이 없다.
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/ {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1api burst=60 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 위 /api/v1/auth/ 블록과 동일한 이유로 헤더를 그대로 통과시킨다 — 채팅/알림/매치 등
        # 이 prefix 아래 모든 인증 필요 엔드포인트가 x-v1-user-id/x-v1-user-email 신뢰 헤더로 동작한다.
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store" always;

        # 대진 자동 생성 계열만 프록시 읽기 타임아웃을 애플리케이션 상한 위로 올린다.
        #
        # 왜 필요한가: 조별 라운드로빈 자동 생성은 대진마다 fixture 뿐 아니라 경기(V1Game)와
        # 사이드·라인업·참가자·감사 행까지 한 트랜잭션에서 만든다
        # (tournaments/league-fixture-generator.service.ts). 8팀 조 2회전이면 56대진이라
        # 순차 DB 왕복이 수천 건이고, 그래서 서비스가 Prisma $transaction 에
        # maxWait 10초 + timeout 120초를 준다. 그런데 nginx 는 proxy_read_timeout 을
        # 지정하지 않으면 기본이 60초라, 애플리케이션 상한(120초)보다 프록시 상한(60초)이
        # 먼저 끊긴다. 그 60~120초 구간에서 운영자는 504 를 받아 "실패했다"고 믿지만
        # 트랜잭션은 계속 돌아 커밋된다. 다시 '자동 생성'을 누르면 409
        # LEAGUE_FIXTURES_ALREADY_EXIST 가 뜨고, 교체를 골라도 이미 만들어진 경기가 걸려
        # 또 409 로 막혀 무엇이 성공했는지 알 수 없게 된다(교체 쪽 409 코드는 되돌리기
        # 작업과 함께 바뀌는 중이라 여기에 이름을 박지 않는다 — 실제 코드는
        # tournaments/league-fixture-generator.service.ts 의 가드에서 확인할 것).
        # 프록시 상한이 애플리케이션 상한보다 커야, 운영자가 보는 타임아웃이 곧 롤백을 뜻한다.
        #
        # 180초 근거: 최악의 애플리케이션 소요는 maxWait 10초 + timeout 120초 = 130초이고,
        # 여기에 트랜잭션 앞뒤 검증·직렬화 여유를 더한 값이다. 더 늘리지 않는 이유는 바로 아래와 같다.
        #
        # 범위를 아래 두 location(라우트 세 개)으로만 좁힌 이유: server 전체나 /api/v1/ 전체에
        # 180초를 걸면 모든 느린 요청이 60초에 드러나지 않고 그만큼 nginx 워커 커넥션이 오래 묶인다.
        # (:leagueId/fixtures/preview 는 DB 를 바꾸지 않는 dry-run 이라 일부러 뺐다.)
        #
        # apps/v1_api 에서 $transaction timeout 120초를 쓰는 곳은 **세 군데**다(2026-08-27
        # `grep -rn 'timeout: 120' apps/v1_api/src` 로 전수 확인):
        #   1) league-matches/league-match-admin.service.ts generateFixtures   → 아래 둘째 location
        #   2) league-matches/league-match-admin.service.ts regenerateFixtures → 아래 둘째 location
        #   3) league-matches/league-series-admin.service.ts runCommitTransaction
        #      = POST /api/v1/admin/league-series/:seriesId/seasons/:seasonNo/promotions/commit
        #
        # **대회 조별 대진 생성기는 이 목록에 없다.** 같은 사고(504 인데 커밋됨)를 프록시를 늘려
        # 막는 대신 **앱 상한을 내려** 막았다 — tournaments/league-fixture-generator.service.ts 의
        # TRANSACTION_TIMEOUT_MS 45초 + maxWait 5초 = 최악 50초라 ALB 60초 안에서 스스로 롤백한다.
        # 그래서 그쪽은 아래 첫 location 이 없어도 안전하지만, location 을 남겨 둔 이유는
        # 프록시 상한이 앱 상한보다 커야 한다는 관계 자체를 유지하기 위해서다(앱 값이 다시
        # 올라가더라도 프록시가 먼저 끊는 상태로 되돌아가지 않는다).
        #      → **덮지 않았다. 지금도 60초에 잘린다.**
        #
        # 4번을 뺀 것은 "없어서"가 아니라 성격이 달라서다. 그쪽 120초는 동시 확정이 커넥션을
        # 못 잡고 죽던 것을 "잠깐 줄 서서 성공"으로 바꾸려고 maxWait 와 함께 올린 값이지 실제
        # 소요 측정치가 아니고, 트랜잭션이 쓰는 것은 승강 이력 createMany 1회 + 다음 시즌 리그
        # 최대 3개(+참가팀) + 감사 로그 1행으로 유계다. 게다가 잘려도 막다른 길이 아니다 —
        # 다시 누르면 409 PROMOTION_ALREADY_DECIDED 로 "이미 확정됐다"를 분명히 알려준다
        # (같은 파일의 catch 가 가용성 실패까지 그 409 로 정규화한다). 대진 생성 쪽이 409
        # LEAGUE_FIXTURES_ALREADY_EXIST → 교체 → 또 409 로 막히는 것과
        # 다르다. **승강 확정이 실제로 60초를 넘는 것이 관측되면** 아래와 같은 모양으로 location 을
        # 하나 더 추가하면 된다(정규식 앵커 `$` 까지 그대로 따라할 것).
        #
        # 중첩 location 인 이유: 같은 레벨에 새 prefix location 을 만들면 위 /api/v1/ 블록의
        # proxy_set_header·add_header·limit_req·include 를 하나도 물려받지 못해 전부 복사해야
        # 하고, 그 복사본이 원본과 갈라지는 순간 헤더·레이트리밋이 조용히 달라진다. 중첩하면
        # 이 블록이 같은 지시어를 하나도 선언하지 않는 한 부모 것을 통째로 상속한다.
        # 그래서 여기에 proxy_set_header 나 add_header 를 "하나만" 추가하면 안 된다 — nginx 는
        # 배열형 지시어를 병합이 아니라 교체로 처리하므로 한 줄만 써도 부모의 나머지가 전부
        # 사라진다. proxy_pass 만 다시 쓰는 이유는 콘텐츠 핸들러가 location 단위라 상속되지
        # 않기 때문이다(빠뜨리면 정적 파일 핸들러로 떨어져 404).
        #
        # 남은 한계 — **이 파일만으로는 60초 벽이 사라지지 않는다.** 앞단 teameet-alb 의
        # idle_timeout 이 60초로 보고돼 있고(2026-08-27 describe-load-balancer-attributes),
        # alpha 와 prod 는 그 ALB **하나**를 나눠 쓴다(README.md "인프라 구조"). idle_timeout 은
        # 리스너·규칙이 아니라 로드밸런서 속성이라 이 저장소 코드로는 못 바꾼다 — AWS 쪽 작업이다.
        # 그래서 60초를 넘기는 요청은 지금도 운영자에게 504 로 보이고 트랜잭션은 계속 돌아 커밋된다.
        # 현재 값의 출처·재확인 명령·왜 문제인지·바꾸려면 무엇을 해야 하는지·그때까지의 완화책은
        # docs/ops/alb-idle-timeout.md 에 있다. 이 nginx 변경은 그 ALB 작업의 **선행 조건**이다
        # (nginx 를 60초로 둔 채 ALB 만 올리면 상한이 nginx 로 옮겨갈 뿐이다).
        location ~ ^/api/v1/admin/tournaments/[^/]+/league/fixtures/generate/?$ {
            proxy_pass http://v1_api;
            proxy_read_timeout 180s;
        }

        # 정규 리그 대진 생성·재생성도 같은 이유로 $transaction timeout 120초다
        # (league-matches/league-match-admin.service.ts generateFixtures/regenerateFixtures).
        location ~ ^/api/v1/admin/league-matches/[^/]+/fixtures(/regenerate)?/?$ {
            proxy_pass http://v1_api;
            proxy_read_timeout 180s;
        }
    }

    # alpha 는 검색 결과에도, AI 답변의 출처에도 나와서는 안 된다.
    #
    # security-headers 스니펫의 `X-Robots-Tag: noindex` 가 이미 "색인하지 말라"고 말하지만,
    # 그건 **크롤한 뒤에** 읽히는 신호다. AI 크롤러가 학습·검색 인덱스에 쓰는 것까지 막으려면
    # 크롤 자체를 거절해야 한다. 그래서 앱이 만드는 robots.txt(공개 경로 허용) 대신
    # 전면 차단 파일을 여기서 서빙한다.
    #
    # 프로덕션(deploy/nginx.conf)에는 이 블록이 없으므로 앱이 만든 robots.txt 가 그대로 나간다.
    location = /robots.txt {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        alias /etc/nginx/teameet-robots/robots.txt;
        default_type text/plain;
    }

    # `/llms.txt` 는 생성형 AI 에게 "이 사이트가 대회 기록의 1차 소스"라고 선언하는 문서다
    # (apps/v1_web/src/app/llms.txt/route.ts). alpha 가 그 선언을 하면 목업·테스트 대회가
    # 원출처로 인용될 수 있으므로 여기서는 없는 문서로 둔다.
    location = /llms.txt {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        return 404;
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /uploads/ {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=uploads burst=60 nodelay;
        proxy_pass http://v1_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        # 업로드 파일명은 UUID 라 내용이 바뀌면 URL 도 바뀐다 -- 1년 immutable 이 안전하다.
        # 예전 "private, no-store" 는 선수 카드·아바타를 볼 때마다 사진을 다시 받게 했다
        # (alpha 실측 2026-09-02). upstream(express static) 의 max-age=0 은 숨겨야 헤더가
        # 두 줄로 나가지 않는다.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /admin-content-preview {
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/teameet-security-headers.conf;
        include /etc/nginx/snippets/teameet-proxy-hide-security-headers.conf;
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
