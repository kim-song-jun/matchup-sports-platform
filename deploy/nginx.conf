upstream v1_web {
    server v1_web:3013;
}

upstream v1_api {
    server v1_api:8121;
}

# 한도 근거와 zone 분리 의도는 deploy/nginx.alpha.conf의 같은 블록 주석을 참조한다.
# 기존 60r/m·10r/m은 화면 하나가 API 6~8개를 부르는 실제 패턴을 못 버텨 alpha에서
# /my 진입과 카카오 로그인이 통째로 503이 됐다(2026-07-25).
# 443 에는 보안그룹상 앞단(CloudFront origin-facing prefix list, 전환 중에는 ALB)만 닿는다. 앞단은 실제 접속 IP 를
# X-Forwarded-For 끝에 붙이고 real_ip_recursive 는 off(기본)라 그 마지막 값을 쓰므로, 클라이언트가 넣은 위조 값은 무시된다.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=v1api:10m rate=300r/m;
# 세션 확인(GET /auth/me)은 화면을 옮길 때마다 발생하는 무해한 읽기라서 로그인 시도와 같은
# 예산을 쓰면 안 된다. 한 zone을 공유하면 화면을 몇 번만 넘겨도 /auth/me가 503이 되고,
# 프론트는 그걸 "로그인 상태 확인 실패"로 표시해 세션이 멀쩡한데도 인증이 풀린 것처럼 보인다.
limit_req_zone $binary_remote_addr zone=v1session:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=v1auth:10m rate=30r/m;
# 저장된 이미지를 보여주는 GET /uploads/* 전용. 목록·갤러리 화면은 한 번에 수십 장의
# 썸네일을 동시에 요청하므로 API 호출보다 여유 있게 잡는다(업로드 생성 POST
# /api/v1/uploads는 인증 경로라 v1api zone을 탄다 — 별개).
limit_req_zone $binary_remote_addr zone=uploads:10m rate=300r/m;

server {
    listen 80;
    server_name teameet.co.kr www.teameet.co.kr;

    return 301 https://teameet.co.kr$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.teameet.co.kr;

    ssl_certificate /etc/letsencrypt/live/teameet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teameet.co.kr/privkey.pem;

    return 301 https://teameet.co.kr$request_uri;
}

server {
    # Host/SNI 가 맞지 않는 요청(예: 오리진 호스트명으로 들어온 앞단 요청)은 www 리다이렉트가 아니라 앱으로 가야 한다.
    listen 443 ssl http2 default_server;
    server_name teameet.co.kr;

    ssl_certificate /etc/letsencrypt/live/teameet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teameet.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    client_max_body_size 55m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # 점검 모드: 플래그 파일이 있으면 모든 요청을 503 점검 페이지로 바꾼다(docs/ops/maintenance-mode.md).
    # 418 은 이 분기 전용 내부 코드다 — error_page 로 503 으로 바꿔 내보내므로 limit_req·upstream 이
    # 만드는 일반 503 은 점검 페이지로 바뀌지 않는다.
    # 이름 있는 location(@)은 원래 메서드를 유지해 정적 파일 핸들러가 POST·PUT 등에 405 를 내므로,
    # URI 로 이동해 메서드를 GET 으로 바꾼다. 이 이동은 server 단계 rewrite 를 다시 돌리므로
    # 이동해 온 요청($uri 가 점검 경로)에는 418 을 다시 내지 않는다(없으면 이동 반복 500). 변수는 읽기 전에
    # 먼저 비운다 — 선언 전 값을 읽으면 요청마다 "uninitialized variable" 경고가 error log 에 쌓인다.
    error_page 418 =503 /__teameet_maintenance.html;
    set $teameet_maintenance "";
    if (-f /etc/nginx/maintenance/on) {
        set $teameet_maintenance "on";
    }
    if ($uri = /__teameet_maintenance.html) {
        set $teameet_maintenance "";
    }
    if ($teameet_maintenance = "on") {
        return 418;
    }

    location = /__teameet_maintenance.html {
        internal;
        # 이동 뒤 location 기준으로 본문 한도를 다시 검사하므로 풀어 두지 않으면 큰 업로드가 413 이 된다.
        client_max_body_size 0;
        alias /etc/nginx/teameet-maintenance/index.html;
        default_type text/html;
        add_header Retry-After "300" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Universal Links. Apple fetches this over https, follows no redirects, and wants JSON
    # from a path with no extension. Serving it lets a /callback/* link open the iOS app so
    # the Kakao sign-in redirect finishes where the session belongs instead of in Safari.
    #
    # The file does not exist until the Apple Team ID does — see deploy/aasa/README.md — and
    # nginx answers 404 until then, which is what it answers today.
    location = /.well-known/apple-app-site-association {
        alias /etc/nginx/teameet-aasa/apple-app-site-association;
        default_type application/json;
        # No `always`: that would attach the header to the 404 this returns until the
        # association file exists, and an hour-long cached 404 is exactly what delays
        # Universal Links from turning on once the file is finally added.
        add_header Cache-Control "public, max-age=3600";
    }

    # 세션 확인 전용. exact match(=)라 아래 ^~ /api/v1/auth/ 블록보다 우선한다.
    # 로그인 시도와 예산을 분리하려는 것이 유일한 목적이므로 나머지 설정은 아래와 동일하다.
    location = /api/v1/auth/me {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1session burst=30 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-V1-User-Id "";
        proxy_set_header X-V1-User-Email "";
        proxy_cache_bypass $http_upgrade;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/v1/auth/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1auth burst=10 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-V1-User-Id "";
        proxy_set_header X-V1-User-Email "";
        proxy_cache_bypass $http_upgrade;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/v1/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1api burst=60 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-V1-User-Id "";
        proxy_set_header X-V1-User-Email "";
        proxy_cache_bypass $http_upgrade;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store";

        # 대진 자동 생성 계열만 프록시 읽기 타임아웃을 애플리케이션 상한 위로 올린다.
        # 값을 왜 이렇게 잡았는지·왜 중첩 location 인지·어떤 엔드포인트가 이 범위에 들고
        # 나는지는 deploy/nginx.alpha.conf 의 같은 블록 주석에 자세히 적어 두었다.
        # 여기서는 프로덕션에서 특히 중요한 세 가지만 반복한다.
        #
        # 1) 이 블록에 proxy_set_header 를 하나라도 추가하면 안 된다. nginx 는 배열형 지시어를
        #    병합이 아니라 교체로 처리하므로, 한 줄만 써도 위 /api/v1/ 블록의 나머지가 전부
        #    사라진다 — 그 안에는 X-V1-User-Id/X-V1-User-Email 을 빈 값으로 덮어쓰는 두 줄이
        #    있고, 그게 빠지면 클라이언트가 보낸 헤더 인증 값이 그대로 API 에 전달된다.
        #    아무것도 선언하지 않아야 부모 설정을 통째로 상속한다(limit_req·add_header 도 같다).
        # 2) proxy_pass 만 다시 쓰는 이유는 콘텐츠 핸들러가 location 단위라 상속되지 않기
        #    때문이다. 빠뜨리면 정적 파일 핸들러로 떨어져 404 가 된다.
        # 3) 사용자에게 보이는 상한은 앞단(ALB·CloudFront)의 응답 대기 시간이 먼저 정한다 — docs/ops/alb-idle-timeout.md
        location ~ ^/api/v1/admin/tournaments/[^/]+/league/fixtures/generate/?$ {
            proxy_pass http://v1_api;
            proxy_read_timeout 180s;
        }

        location ~ ^/api/v1/admin/league-matches/[^/]+/fixtures(/regenerate)?/?$ {
            proxy_pass http://v1_api;
            proxy_read_timeout 180s;
        }
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /uploads/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=uploads burst=100 nodelay;
        proxy_pass http://v1_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 업로드 파일명은 UUID 라 내용이 바뀌면 URL 도 바뀐다 -- 1년 immutable 이 안전하다.
        # upstream(express static) 은 max-age=0 을 보내므로 숨기고 다시 쓴다(alpha 와 동일).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
    }

    location ^~ /admin-content-preview {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

}
