upstream v1_web {
    server v1_web:3013;
}

upstream v1_api {
    server v1_api:8121;
}

# 한도 근거와 zone 분리 의도는 deploy/nginx.alpha.conf의 같은 블록 주석을 참조한다.
# 기존 60r/m·10r/m은 화면 하나가 API 6~8개를 부르는 실제 패턴을 못 버텨 alpha에서
# /my 진입과 카카오 로그인이 통째로 503이 됐다(2026-07-25).
#
# prod의 LB 구성이 확정되어(2026-07-27 실측) alpha와 동일한 real_ip 교정을 넣는다.
# teameet.co.kr DNS → teameet-alb(4노드) → 443 리스너 default 규칙 → teameet-prod-tg →
# 이 인스턴스. 즉 prod도 ALB 뒤이며, 교정 없이는 $binary_remote_addr가 실사용자가 아니라
# ALB 노드 IP(172.31.x.x)가 되어 접속자 전원이 노드 수만큼의 버킷을 공유한다 — 한 사람이
# 화면 몇 개만 열어도 무관한 다른 사용자까지 503을 맞는, alpha에서 실제로 터진 그 구조다.
# real_ip_recursive는 기본값(off)을 유지한다 — ALB가 X-Forwarded-For 끝에 실제 접속 IP를
# 덧붙이므로 마지막 값이 신뢰할 수 있는 주소이고, 클라이언트가 XFF를 위조해도 그 뒤에
# 실주소가 붙어 스푸핑이 성립하지 않는다.
set_real_ip_from 172.31.0.0/16;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=v1api:10m rate=300r/m;
# 세션 확인(GET /auth/me)은 화면을 옮길 때마다 발생하는 무해한 읽기라서 로그인 시도와 같은
# 예산을 쓰면 안 된다. 한 zone을 공유하면 화면을 몇 번만 넘겨도 /auth/me가 503이 되고,
# 프론트는 그걸 "로그인 상태 확인 실패"로 표시해 세션이 멀쩡한데도 인증이 풀린 것처럼 보인다.
limit_req_zone $binary_remote_addr zone=v1session:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=v1auth:10m rate=30r/m;
# 저장된 이미지를 보여주는 GET /uploads/* 전용. 목록·갤러리 화면은 한 번에 수십 장의
# 썸네일을 동시에 요청하므로 API 호출보다 여유 있게 잡는다(업로드 생성 POST
# /api/v1/uploads는 인증 경로라 v1api zone을 탄다 — 별개).
limit_req_zone $binary_remote_addr zone=uploads:10m rate=300r/m;

server {
    listen 80;
    server_name teameet.co.kr www.teameet.co.kr;

    return 301 https://teameet.co.kr$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.teameet.co.kr;

    ssl_certificate /etc/letsencrypt/live/teameet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teameet.co.kr/privkey.pem;

    return 301 https://teameet.co.kr$request_uri;
}

server {
    # default_server 로 지정하는 이유: ALB 헬스체크는 타깃 IP 로 직접 접속하므로 Host 가
    # teameet.co.kr 이 아니고, SNI 도 없다. 그러면 nginx 는 443 의 "첫" server 블록을
    # 고르는데 그게 위의 www 리다이렉트라서 헬스체크가 301 을 받아 계속 unhealthy 였다
    # (Target.ResponseCodeMismatch). 타깃 전원이 unhealthy 면 ALB 가 fail-open 으로
    # 그대로 전달해 서비스는 떠 있었지만, 그만큼 헬스체크 보호가 꺼진 상태였다.
    # alpha 는 443 블록이 앱 하나뿐이라 우연히 이 문제가 없었다 — 여기서는 명시한다.
    listen 443 ssl http2 default_server;
    server_name teameet.co.kr;

    ssl_certificate /etc/letsencrypt/live/teameet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teameet.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    client_max_body_size 55m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # ALB 헬스체크 전용 엔드포인트. "/" 로 검사하면 Next.js SSR 페이지를 30초마다 렌더하게
    # 되므로 API 의 health 만 확인한다. rate limit 을 걸지 않는다 — 헬스체크가 사용자
    # 트래픽과 예산을 나눠 쓰면 한도 초과 시 503 을 받아 타깃이 통째로 빠진다.
    # access_log 를 끄는 이유는 30초마다 찍히는 이 요청이 로그를 뒤덮기 때문이다.
    location = /healthz {
        access_log off;
        proxy_pass http://v1_api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # 세션 확인 전용. exact match(=)라 아래 ^~ /api/v1/auth/ 블록보다 우선한다.
    # 로그인 시도와 예산을 분리하려는 것이 유일한 목적이므로 나머지 설정은 아래와 동일하다.
    location = /api/v1/auth/me {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1session burst=30 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-V1-User-Id "";
        proxy_set_header X-V1-User-Email "";
        proxy_cache_bypass $http_upgrade;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/v1/auth/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1auth burst=10 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-V1-User-Id "";
        proxy_set_header X-V1-User-Email "";
        proxy_cache_bypass $http_upgrade;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/v1/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=v1api burst=60 nodelay;
        proxy_pass http://v1_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-V1-User-Id "";
        proxy_set_header X-V1-User-Email "";
        proxy_cache_bypass $http_upgrade;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-store";

        # 대진 자동 생성 계열만 프록시 읽기 타임아웃을 애플리케이션 상한 위로 올린다.
        # 값을 왜 이렇게 잡았는지·왜 중첩 location 인지·어떤 엔드포인트가 이 범위에 들고
        # 나는지는 deploy/nginx.alpha.conf 의 같은 블록 주석에 자세히 적어 두었다.
        # 여기서는 프로덕션에서 특히 중요한 세 가지만 반복한다.
        #
        # 1) 이 블록에 proxy_set_header 를 하나라도 추가하면 안 된다. nginx 는 배열형 지시어를
        #    병합이 아니라 교체로 처리하므로, 한 줄만 써도 위 /api/v1/ 블록의 나머지가 전부
        #    사라진다 — 그 안에는 X-V1-User-Id/X-V1-User-Email 을 빈 값으로 덮어쓰는 두 줄이
        #    있고, 그게 빠지면 클라이언트가 보낸 헤더 인증 값이 그대로 API 에 전달된다.
        #    아무것도 선언하지 않아야 부모 설정을 통째로 상속한다(limit_req·add_header 도 같다).
        # 2) proxy_pass 만 다시 쓰는 이유는 콘텐츠 핸들러가 location 단위라 상속되지 않기
        #    때문이다. 빠뜨리면 정적 파일 핸들러로 떨어져 404 가 된다.
        # 3) **이 180초는 아직 사용자에게 보이지 않는다.** 실제 상한은 앞단 teameet-alb 의
        #    idle_timeout(60초)이고, 그 값은 이 저장소 코드로 못 바꾼다 — AWS 쪽 작업이다.
        #    그래서 60초를 넘기는 요청은 지금도 운영자에게 504 로 보이는데 트랜잭션은 커밋된다.
        #    현재 값·재확인 명령·변경 절차·완화책: docs/ops/alb-idle-timeout.md
        #    (이 블록은 그 ALB 작업의 선행 조건이다 — nginx 를 60초로 둔 채 ALB 만 올리면
        #    상한이 nginx 로 옮겨갈 뿐이다.)
        location ~ ^/api/v1/admin/tournaments/[^/]+/league/fixtures/generate/?$ {
            proxy_pass http://v1_api;
            proxy_read_timeout 180s;
        }

        location ~ ^/api/v1/admin/league-matches/[^/]+/fixtures(/regenerate)?/?$ {
            proxy_pass http://v1_api;
            proxy_read_timeout 180s;
        }
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /uploads/ {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        limit_req zone=uploads burst=100 nodelay;
        proxy_pass http://v1_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /admin-content-preview {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/teameet-release-metadata.conf;
        proxy_pass http://v1_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

}
