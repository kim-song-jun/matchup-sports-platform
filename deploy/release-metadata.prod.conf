# 프로덕션 릴리스 식별 헤더. alpha 의 release-metadata.alpha.conf 와 같은 역할이다.
#
# 이 파일은 배포 때마다 deploy.yml 의 "Stamp prod release metadata" 스텝이 호스트
# (~/teameet/deploy/release-metadata.prod.conf)에서 실제 값으로 덮어쓴다. 여기 커밋된
# 내용은 두 가지 이유로 필요한 플레이스홀더다.
#
#   1. nginx.conf 가 이 파일을 include 하므로, 파일이 없으면 nginx 가 아예 뜨지 않는다.
#      build-images 의 `rsync --delete` 가 매 배포마다 저장소 버전으로 되돌리므로,
#      저장소에 유효한 파일이 항상 있어야 한다.
#   2. 승인 게이트에서 배포가 중단돼 스탬프 스텝이 실행되지 않아도 nginx 는 정상 기동한다.
#      그 경우 헤더는 unknown 으로 남고, 이는 "값이 틀린" 것보다 낫다.
#
# 값이 반영되려면 nginx 컨테이너가 recreate 돼야 한다(bind mount 는 inode 를 따라가므로
# reload 만으로는 새 파일이 보이지 않는다). restart-containers.sh 가
# `up -d --force-recreate --no-deps v1_web nginx` 로 이를 보장한다.
add_header X-Teameet-Release "unknown" always;
add_header X-Teameet-Commit "unknown" always;
